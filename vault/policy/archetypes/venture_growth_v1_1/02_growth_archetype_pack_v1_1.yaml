metadata:
  name: PANTA Growth Archetype Pack
  version: 1.1.0
  date: '2026-09-04'
  status: IMPLEMENTATION_CANDIDATE_PENDING_BLIND_BENCHMARK
  extends_kernel: PANTA Universal Investment Kernel 0.2.0
  purpose: Reusable Growth underwriting grammar for case formation, semantic extraction, model routing and re-underwriting.
  derivation:
    top_down: Derived independently from the economics and epistemology of the strategy.
    evidence_challenge: Challenged against varied underwriting patterns, counterexamples and later-state logic without
      importing institution-specific policy, names or thresholds.
    membership_rule: Economic necessity determines Archetype membership; observed frequency never establishes universality.
  confidentiality:
    contains_identifiable_firm_fund_person_or_company_names: false
    contains_proprietary_source_references: false
    contains_institution_specific_thresholds_or_policies: false
    contains_case_specific_values_or_examples: false
  not_a_checklist: true
  open_world: true
strategy_definition:
  strategy: GROWTH
  core_economic_problem: Underwrite a security exposure to an operating company with demonstrated demand while testing
    the durability, repeatability, scalability, capital efficiency and liquidity of its growth engine.
  epistemic_regime: Current actuals, customers and cohorts anchor the case. The main uncertainty is whether the observed
    engine generalizes across time, segments, geographies, products and organizational scale.
  dominant_loss_orientation:
  - reported growth is low-quality, acquired, one-off or concentrated
  - customer value does not sustain retention, expansion or pricing
  - GTM does not repeat beyond founders, one channel or one geography
  - delivery, service or capital burden prevents operating leverage
  - management and controls do not scale
  - future financing, dilution or liquidity timing weakens the security return
  - multiple compression overwhelms operating progress
  default_decision_moments:
  - screen or pursue
  - new growth investment
  - term or allocation decision
  - closing or funding
  - follow-on
  - secondary or liquidity
  - bridge or recapitalization
  - transformation or re-underwriting
archetype_selection:
  select_when:
  - A real operating and customer engine exists and can be measured.
  - The core investment question is whether that engine is durable and repeatable at larger scale.
  - Capital is used mainly to accelerate, replicate or finance the engine rather than create its first proof.
  do_not_select_by:
  - round label alone
  - company age alone
  - current revenue alone
  hybrid_rule: Activate Venture modules where a new product, technical program or market remains milestone-dependent
    and unproven.
deal_frame_extensions:
- current_revenue_and_recurring_base
- growth_stage_and_engine_maturity
- customer_and_segment_concentration
- primary_growth_vectors
- current_cash_and_path_to_self_funding
- round_or_security
- primary_secondary_mix
- current_and_target_ownership
- liquidity_or_exit_context
- follow_on_or_new_investment
proof_ladder:
  principle: Growth proof progresses from reported scale to reconciled, durable, repeatable and cash-generative scale
    using the economic unit selected by the active business-model modules.
  progression:
  - reported growth
  - reconciled business-model operating unit and recognized revenue
  - durable repeat, renewal, reorder, contract conversion or cohort behavior
  - repeatable customer acquisition, channel production or project origination
  - replication across another segment, product, channel or geography
  - operating leverage
  - cash generation and financing independence
  rule: The sequence is causal, not a universal numeric score. Exact evidence bars belong to the Fund Lens, and inapplicable
    steps remain dormant.
workstreams:
  MARKET_HEADROOM_AND_CATEGORY_DURABILITY:
    governing_question: How much durable growth remains available, and where must the next increment come from?
    first_principles_rationale: A Growth investment pays for future scale in a company that already has operating
      evidence. Underwriting must separate category growth, share capture, segment expansion and pricing from a generic
      large-market narrative.
    question_families:
    - id: GF-MKT-01
      question: What is the correctly defined market for the current product, buyer, geography and value-chain position?
      concept_families:
      - market_definition
      - current_addressable_market
      - buyer_segment
      typical_evidence:
      - customer and revenue segmentation
      - industry data
      - value-chain evidence
      expected_case_outputs:
      - Definition
      - MetricObservation
      - CaseReading
      proof_direction: Use the actual revenue engine to define the market.
    - id: GF-MKT-02
      question: How much growth comes from category expansion, share gain, pricing, product expansion or acquisitions?
      concept_families:
      - growth_source
      - market_growth
      - share_capture
      - pricing
      - acquired_growth
      typical_evidence:
      - historical bridge
      - market data
      - customer wins
      - acquisition history
      expected_case_outputs:
      - MetricObservation
      - ModelNode
      - Assumption
      proof_direction: Decompose growth rather than extrapolating the headline rate.
    - id: GF-MKT-03
      question: Which segment, geography, product or channel provides the next credible growth pool?
      concept_families:
      - expansion_vector
      - segment_headroom
      - geographic_headroom
      - product_headroom
      typical_evidence:
      - segment cohorts
      - pipeline
      - market share
      - competitive position
      expected_case_outputs:
      - Question
      - CaseReading
      - ModelNode
      proof_direction: Connect each expansion vector to evidence and capability.
    - id: GF-MKT-04
      question: What cyclicality, regulation, platform change or market saturation could shorten the growth duration?
      concept_families:
      - growth_duration
      - cyclicality
      - regulatory_change
      - saturation
      typical_evidence:
      - historical cycles
      - regulatory timeline
      - platform roadmap
      - penetration data
      expected_case_outputs:
      - Risk
      - Condition
      - Assumption
      proof_direction: Model duration and timing, not only terminal market size.
    - id: GF-MKT-05
      question: What evidence would show that the addressable market or growth vector is smaller than assumed?
      concept_families:
      - market_falsifier
      - share_ceiling
      - expansion_failure
      typical_evidence:
      - lost deals
      - segment economics
      - regional performance
      - competitor response
      expected_case_outputs:
      - Unknown
      - WorkItem
      - Risk
      proof_direction: Define the observation that would reduce growth headroom.
    reasoning_operators:
    - MARKET_DEFINITION
    - GROWTH_DECOMPOSITION
    - SEGMENTATION
    - SHARE_CAPTURE
    - GROWTH_DURATION
    - FALSIFY
    failure_modes:
    - large market disguises limited obtainable headroom
    - current growth relies on a temporary market or regulatory dislocation
    - share gain is assumed without a repeatable advantage
    - new geographies or segments have different economics
    - acquired growth is mistaken for organic engine quality
    model_bindings:
    - market_growth
    - share
    - price
    - volume
    - segment_mix
    - geography_mix
  PRODUCT_VALUE_AND_COMPETITIVE_POSITION:
    governing_question: Does the product create durable, measurable customer value that can withstand competition
      and platform change?
    first_principles_rationale: At Growth stage, product quality must already be visible in customer behavior. The
      question is whether the product remains differentiated and mission-critical enough to sustain retention, expansion
      and pricing.
    question_families:
    - id: GF-PROD-01
      question: What measurable operational, financial or strategic outcome does the product create?
      concept_families:
      - customer_value
      - customer_roi
      - workflow_criticality
      typical_evidence:
      - customer reference
      - before-and-after metric
      - competitive trial
      - usage data
      expected_case_outputs:
      - MetricObservation
      - CaseReading
      - Claim
      proof_direction: Tie product value to customer behavior and economics.
    - id: GF-PROD-02
      question: How deeply is the product used, by whom, and in which production workflows?
      concept_families:
      - product_usage
      - user_penetration
      - workflow_embedding
      typical_evidence:
      - usage logs
      - seat or volume data
      - feature adoption
      - customer workflow
      expected_case_outputs:
      - MetricObservation
      - CaseReading
      - Unknown
      proof_direction: Separate a purchased product from an adopted product.
    - id: GF-PROD-03
      question: Why do customers choose, renew, expand or replace the product?
      concept_families:
      - win_loss
      - retention_driver
      - expansion_driver
      - switching
      typical_evidence:
      - customer calls
      - tender evidence
      - renewal notes
      - churn interviews
      expected_case_outputs:
      - CaseReading
      - Risk
      - WorkItem
      proof_direction: Use behavior across the customer lifecycle.
    - id: GF-PROD-04
      question: What is the moat mechanism, and is it strengthening or eroding with scale?
      concept_families:
      - moat_mechanism
      - data_advantage
      - network_effect
      - distribution
      - switching_cost
      typical_evidence:
      - cohort behavior
      - competitive bake-off
      - data or cost curve
      - partner evidence
      expected_case_outputs:
      - Assumption
      - MetricObservation
      - CaseReading
      proof_direction: Test whether scale compounds advantage rather than only company size.
    - id: GF-PROD-05
      question: What can incumbents, platforms or adjacent vendors copy, bundle or control?
      concept_families:
      - commoditization
      - platform_dependency
      - incumbent_response
      typical_evidence:
      - product roadmaps
      - platform policy
      - competitive releases
      - expert evidence
      expected_case_outputs:
      - Risk
      - Condition
      - CaseReading
      proof_direction: Assess the product against a capable response.
    reasoning_operators:
    - CUSTOMER_OUTCOME
    - USAGE_DEPTH
    - WIN_LOSS
    - RETENTION_DRIVER
    - MOAT_MECHANISM
    - ADVERSARIAL_RESPONSE
    failure_modes:
    - strong demo or product score does not create adoption
    - product remains optional in the customer's workflow
    - incumbent bundles a good-enough substitute
    - implementation or support burden offsets product value
    - moat is a temporary execution lead rather than a compounding asset
    model_bindings:
    - usage
    - renewal
    - expansion
    - price
    - win_rate
    - gross_margin
  REVENUE_QUALITY_AND_CUSTOMER_DURABILITY:
    governing_question: How much of reported growth is recurring, retained, organic, diversified and economically
      real?
    first_principles_rationale: Growth underwriting begins with the quality and identity of the existing revenue base.
      Revenue, ARR, bookings, backlog, GMV and pipeline are different objects and must reconcile to customer-level
      behavior.
    question_families:
    - id: GF-REV-01
      question: What does each reported growth measure represent, and how does it reconcile to recognized revenue
        and customer-level activity?
      concept_families:
      - revenue_definition
      - recurring_revenue
      - bookings
      - backlog
      - pipeline
      - business_model_operating_volume
      typical_evidence:
      - contracts
      - billing data
      - revenue recognition
      - CRM
      - financial statements
      expected_case_outputs:
      - Definition
      - MetricObservation
      - CoverageLimit
      proof_direction: Keep recognized revenue, recurring base, contracted value, backlog, pipeline and operating-volume
        measures as distinct identities.
    - id: GF-REV-02
      question: How much growth is organic, acquired, one-off, price, volume, mix, expansion or new-logo driven?
      concept_families:
      - organic_growth
      - acquired_growth
      - price_volume_mix
      - new_vs_expansion
      typical_evidence:
      - revenue bridge
      - customer-level data
      - acquisition data
      - invoice history
      expected_case_outputs:
      - MetricObservation
      - ModelNode
      - CaseReading
      proof_direction: Decompose the current engine into causal components.
    - id: GF-REV-03
      question: What do repeat purchase, renewal, gross retention, net retention, churn and expansion show for the
        relevant customer or economic unit?
      concept_families:
      - gross_retention
      - net_retention
      - churn
      - cohort_expansion
      typical_evidence:
      - customer cohorts
      - renewal data
      - usage
      - contract history
      expected_case_outputs:
      - MetricObservation
      - CaseReading
      - Risk
      proof_direction: Activate only the repeat/durability measures appropriate to the selected business-model modules.
    - id: GF-REV-04
      question: How concentrated is revenue by customer, channel, product, geography, contract type and source?
      concept_families:
      - customer_concentration
      - channel_concentration
      - product_concentration
      - source_concentration
      typical_evidence:
      - customer-level revenue
      - channel data
      - contract register
      - segment P&L
      expected_case_outputs:
      - MetricObservation
      - Risk
      - Condition
      proof_direction: Measure correlated exposure, not only the largest account.
    - id: GF-REV-05
      question: What portion of the current revenue base is contractually visible, implemented and likely to be recognized?
      concept_families:
      - contract_durability
      - implementation_status
      - revenue_visibility
      typical_evidence:
      - contract terms
      - implementation plan
      - usage and billing status
      - customer reference
      expected_case_outputs:
      - CaseReading
      - Assumption
      - ModelNode
      proof_direction: Separate signed value from executable revenue.
    reasoning_operators:
    - METRIC_IDENTITY
    - REVENUE_BRIDGE
    - COHORT
    - RETENTION
    - CONCENTRATION
    - CONTRACT_TO_REVENUE
    failure_modes:
    - bookings or pipeline presented as recurring revenue
    - acquired or one-off growth presented as organic
    - changing cohort definitions create false retention
    - headline NRR hides segment or customer concentration
    - contracted revenue fails to implement or recognize
    model_bindings:
    - opening_arr
    - new_arr
    - expansion
    - contraction
    - churn
    - revenue
    - backlog
  GO_TO_MARKET_REPEATABILITY_AND_EXPANSION:
    governing_question: Can the company acquire and expand customers repeatedly across reps, channels, segments and
      geographies?
    first_principles_rationale: Growth capital normally accelerates or replicates an observed core engine. Underwriting
      must connect pipeline, conversion, commercial capacity, acquisition cost, implementation and customer expansion;
      where a material new engine remains unproven, selected Venture modules are activated.
    question_families:
    - id: GF-GTM-01
      question: What is the historical funnel from qualified opportunity to contracted, implemented and paying customer?
      concept_families:
      - pipeline_quality
      - conversion
      - implementation
      - sales_cycle
      typical_evidence:
      - CRM
      - contracts
      - implementation status
      - invoice data
      expected_case_outputs:
      - MetricObservation
      - ModelNode
      - CoverageLimit
      proof_direction: Use stage definitions and historical conversion, not raw pipeline value.
    - id: GF-GTM-02
      question: How much output comes from founder relationships, one channel or one partner versus a repeatable motion?
      concept_families:
      - founder_led_sales
      - channel_dependency
      - partner_dependency
      - repeatability
      typical_evidence:
      - lead-source data
      - rep cohorts
      - partner economics
      - customer attribution
      expected_case_outputs:
      - CaseReading
      - Risk
      - Unknown
      proof_direction: Separate exceptional access from institutionalized distribution.
    - id: GF-GTM-03
      question: What do rep ramp, quota, attainment, productivity and capacity imply for the forecast?
      concept_families:
      - sales_capacity
      - rep_ramp
      - quota
      - attainment
      typical_evidence:
      - rep-level data
      - hiring plan
      - quota history
      - pipeline coverage
      expected_case_outputs:
      - MetricObservation
      - ModelNode
      - Assumption
      proof_direction: Build growth from productive capacity rather than headcount alone.
    - id: GF-GTM-04
      question: Where acquisition can be cohort-measured, what are acquisition cost, payback and conversion by channel,
        segment and geography?
      concept_families:
      - cac
      - payback
      - conversion
      - channel_efficiency
      typical_evidence:
      - marketing and sales spend
      - lead-source data
      - cohorts
      - gross profit
      expected_case_outputs:
      - MetricObservation
      - CaseReading
      - Risk
      proof_direction: Use the acquisition and contribution definitions selected by the business-model modules.
    - id: GF-GTM-05
      question: Has the motion repeated in a second segment, product, channel or geography with comparable economics?
      concept_families:
      - replication
      - geographic_repeatability
      - segment_repeatability
      - cross_sell
      typical_evidence:
      - regional cohorts
      - new product cohorts
      - channel cohorts
      - win-loss evidence
      expected_case_outputs:
      - CaseReading
      - Assumption
      - WorkItem
      proof_direction: Treat expansion as a new proof problem, not a copy of the core market.
    reasoning_operators:
    - FUNNEL
    - PIPELINE_STAGE
    - SALES_CAPACITY
    - CAC_PAYBACK
    - CHANNEL_ATTRIBUTION
    - REPLICATION
    failure_modes:
    - headline pipeline has weak stage quality
    - founder or partner access does not institutionalize
    - sales hires add cost before productivity
    - implementation delay breaks the booking-to-revenue bridge
    - a successful core geography does not repeat
    model_bindings:
    - pipeline
    - conversion
    - sales_cycle
    - productive_reps
    - quota
    - attainment
    - cac
    - new_arr
  UNIT_ECONOMICS_AND_OPERATING_LEVERAGE:
    governing_question: Does incremental growth create enough gross profit and contribution to support durable operating
      leverage?
    first_principles_rationale: The correct profit measure depends on the economic delivery model. Growth investors
      must identify all variable costs, separate accounting presentation from economic contribution and test the mechanism
      of margin expansion.
    question_families:
    - id: GF-ECO-01
      question: What is the economically correct unit and profit measure for this business?
      concept_families:
      - economic_unit
      - gross_margin_definition
      - contribution_definition
      typical_evidence:
      - cost accounting
      - delivery workflow
      - customer or transaction unit
      - P&L
      expected_case_outputs:
      - Definition
      - MetricObservation
      - CaseReading
      proof_direction: Define the unit before comparing margins or valuation.
    - id: GF-ECO-02
      question: How do price, volume, mix, delivery cost, support and partner share determine unit economics?
      concept_families:
      - price_volume_mix
      - delivery_cost
      - support_cost
      - partner_share
      typical_evidence:
      - invoice and cost data
      - supplier or partner terms
      - implementation data
      expected_case_outputs:
      - MetricObservation
      - ModelNode
      - Assumption
      proof_direction: Build the actual contribution bridge.
    - id: GF-ECO-03
      question: What evidence supports gross-margin or contribution-margin expansion?
      concept_families:
      - margin_expansion
      - automation
      - utilization
      - procurement
      - pricing_power
      typical_evidence:
      - historical margin bridge
      - cost curve
      - capacity data
      - pricing evidence
      expected_case_outputs:
      - CaseReading
      - Assumption
      - Risk
      proof_direction: Require a causal mechanism rather than a target percentage.
    - id: GF-ECO-04
      question: What does it cost to acquire, contract, implement and retain the relevant customer or economic unit,
        and how quickly is that cost recovered?
      concept_families:
      - acquisition_cost
      - contracting_cost
      - implementation_cost
      - retention_cost
      - cost_recovery
      typical_evidence:
      - sales and marketing allocation
      - implementation labor
      - cohort gross profit
      expected_case_outputs:
      - MetricObservation
      - ModelNode
      - CoverageLimit
      proof_direction: Use the economic unit and contribution definition supplied by the active business-model modules.
    - id: GF-ECO-05
      question: At what growth and margin state does the company generate EBITDA and free cash flow, and what capital
        is consumed first?
      concept_families:
      - ebitda
      - free_cash_flow
      - breakeven
      - capital_consumption
      typical_evidence:
      - integrated model
      - working capital
      - capex
      - cash taxes
      expected_case_outputs:
      - ModelNode
      - CaseReading
      - Risk
      proof_direction: Connect growth quality to self-funding capacity.
    reasoning_operators:
    - ECONOMIC_UNIT
    - PRICE_VOLUME_MIX
    - CONTRIBUTION_MARGIN
    - FULLY_LOADED_CAC
    - OPERATING_LEVERAGE
    - CASH_CONVERSION
    failure_modes:
    - management gross margin omits delivery or refurbishment cost
    - software narrative hides services or implementation intensity
    - margin expansion relies on unproven automation
    - growth is attractive before acquisition and support cost but not after
    - EBITDA path ignores capex, working capital or cash taxes
    model_bindings:
    - price
    - volume
    - gross_margin
    - contribution_margin
    - cac
    - ltv
    - ebitda
    - free_cash_flow
  OPERATING_CAPACITY_AND_SCALABILITY:
    governing_question: Can systems, people, capacity, supply and implementation support the planned growth without
      degrading economics or quality?
    first_principles_rationale: Revenue growth may be demand-constrained, capacity-constrained or implementation-constrained.
      Operating bottlenecks must be connected to recognized revenue, customer outcomes, margin and capital.
    question_families:
    - id: GF-OPS-01
      question: What physical, technical or human capacity constrains current delivery?
      concept_families:
      - capacity
      - utilization
      - bottleneck
      - delivery_capacity
      typical_evidence:
      - site or workflow data
      - implementation backlog
      - production metrics
      - staffing
      expected_case_outputs:
      - MetricObservation
      - CaseReading
      - Risk
      proof_direction: Identify the binding constraint rather than average capacity.
    - id: GF-OPS-02
      question: What implementation, onboarding or service effort is required for each new customer or unit?
      concept_families:
      - implementation_intensity
      - onboarding
      - service_capacity
      typical_evidence:
      - project data
      - time tracking
      - customer go-live history
      - support data
      expected_case_outputs:
      - MetricObservation
      - ModelNode
      - CaseReading
      proof_direction: Connect bookings to delivery and revenue recognition.
    - id: GF-OPS-03
      question: What capex, inventory, working capital or supplier commitment is required to scale?
      concept_families:
      - capex
      - inventory
      - working_capital
      - supplier_capacity
      typical_evidence:
      - capacity plan
      - inventory data
      - payment terms
      - supplier agreements
      expected_case_outputs:
      - MetricObservation
      - ModelNode
      - Condition
      proof_direction: Model the cash consequence of scale.
    - id: GF-OPS-04
      question: Can technology, data, security and reporting systems support a larger and more demanding customer
        base?
      concept_families:
      - systems_readiness
      - data_quality
      - security
      - reporting
      typical_evidence:
      - architecture
      - security review
      - reporting process
      - customer requirements
      expected_case_outputs:
      - Risk
      - Condition
      - WorkItem
      proof_direction: Treat enterprise readiness as an operating dependency.
    - id: GF-OPS-05
      question: What quality, reliability or customer outcome deteriorates if growth arrives faster than planned?
      concept_families:
      - quality_at_scale
      - reliability
      - service_level
      - customer_outcome
      typical_evidence:
      - failure logs
      - backlog
      - SLA data
      - customer complaints
      expected_case_outputs:
      - Risk
      - CaseReading
      - Condition
      proof_direction: Expose the failure state created by growth itself.
    reasoning_operators:
    - BOTTLENECK
    - CAPACITY
    - IMPLEMENTATION_BRIDGE
    - WORKING_CAPITAL
    - SYSTEMS_READINESS
    - QUALITY_AT_SCALE
    failure_modes:
    - sales outpace implementation or production
    - capacity expansion consumes more capital than modeled
    - manual operations prevent margin expansion
    - security or reporting blocks enterprise growth
    - quality or customer outcomes degrade with scale
    model_bindings:
    - capacity
    - utilization
    - implementation_time
    - inventory
    - working_capital
    - capex
    - service_cost
  MANAGEMENT_ORGANIZATION_AND_GOVERNANCE:
    governing_question: Can the leadership team build the organization, controls and execution cadence required for
      the next scale state?
    first_principles_rationale: Growth underwriting is an organizational scaling problem. The team must move from
      founder or early executive heroics to repeatable sales, delivery, finance and governance without losing speed.
    question_families:
    - id: GF-TEAM-01
      question: Has management delivered prior forecasts, milestones and corrective actions with credible transparency?
      concept_families:
      - forecast_accuracy
      - execution_history
      - transparency
      typical_evidence:
      - budget versus actual
      - board history
      - revised plan
      - references
      expected_case_outputs:
      - MetricObservation
      - StatedPosition
      - CaseReading
      proof_direction: Use observed behavior, not biography alone.
    - id: GF-TEAM-02
      question: Which leadership and functional capabilities are missing for the next phase?
      concept_families:
      - leadership_gap
      - functional_maturity
      - hiring_plan
      typical_evidence:
      - organization chart
      - role requirements
      - candidate pipeline
      - operating evidence
      expected_case_outputs:
      - Unknown
      - Condition
      - WorkItem
      proof_direction: Map capability gaps to the growth model.
    - id: GF-TEAM-03
      question: Can founders delegate and can new executives integrate without damaging the operating engine?
      concept_families:
      - delegation
      - executive_integration
      - founder_dependency
      typical_evidence:
      - references
      - decision history
      - turnover
      - operating cadence
      expected_case_outputs:
      - CaseReading
      - Risk
      - Outcome
      proof_direction: Evaluate the transition, not only the hire.
    - id: GF-TEAM-04
      question: Are incentives, governance, reporting and controls aligned with the capital and execution plan?
      concept_families:
      - incentives
      - governance
      - reporting_controls
      - board_effectiveness
      typical_evidence:
      - cap table
      - board materials
      - audit findings
      - reserved matters
      expected_case_outputs:
      - Condition
      - Risk
      - CaseReading
      proof_direction: Separate legal rights from demonstrated governance quality.
    - id: GF-TEAM-05
      question: What key-person, integrity, reporting or organizational risk could impair financing or exit?
      concept_families:
      - key_person
      - integrity
      - reporting_quality
      - exit_readiness
      typical_evidence:
      - references
      - audit history
      - regulatory evidence
      - management behavior
      expected_case_outputs:
      - Risk
      - CaseReading
      - WorkItem
      proof_direction: Connect governance and reporting to enterprise value and liquidity.
    reasoning_operators:
    - FORECAST_ACCURACY
    - ROLE_REQUIREMENT_MAPPING
    - REFERENCE_TRIANGULATION
    - DELEGATION
    - GOVERNANCE_ALIGNMENT
    - CONTROL_READINESS
    failure_modes:
    - founder-led execution cannot scale
    - senior hires fail or arrive too late
    - forecast optimism persists without correction
    - reporting or control weakness blocks financing or exit
    - governance rights exist but cannot change behavior
    model_bindings:
    - headcount
    - hiring_date
    - sales_capacity
    - opex
    - forecast_accuracy
    - financing_date
  CAPITAL_NEEDS_AND_FINANCING_OPTIONALITY:
    governing_question: Can the company finance the growth plan and downside without destroying strategic or shareholder
      optionality?
    first_principles_rationale: A growth company may still be far from self-funding. The investment case must connect
      burn, working capital, capex, future raises, debt capacity, dilution and the timing of market access.
    question_families:
    - id: GF-CAP-01
      question: What are current cash, normalized burn, liquidity and runway under base and downside cases?
      concept_families:
      - cash
      - burn
      - liquidity
      - runway
      typical_evidence:
      - cash data
      - monthly actuals
      - working capital
      - capex plan
      expected_case_outputs:
      - MetricObservation
      - ModelNode
      - CaseReading
      proof_direction: Use an integrated cash view rather than EBITDA alone.
    - id: GF-CAP-02
      question: How much capital is required to reach self-funding or the next credible financing state?
      concept_families:
      - capital_need
      - breakeven_funding
      - next_financing
      typical_evidence:
      - integrated model
      - use of funds
      - milestones
      - financing plan
      expected_case_outputs:
      - ModelNode
      - Assumption
      - Condition
      proof_direction: Separate planned raise from required capital.
    - id: GF-CAP-03
      question: What debt, working-capital, project, grant, prepayment or partner financing is available and conditional
        on what?
      concept_families:
      - non_equity_financing
      - debt_capacity
      - prepayment
      - grant
      - project_finance
      typical_evidence:
      - financing terms
      - contract cash flows
      - lender evidence
      - grant conditions
      expected_case_outputs:
      - Condition
      - ModelNode
      - Risk
      proof_direction: Connect funding availability to operating evidence and covenants.
    - id: GF-CAP-04
      question: What dilution, preference or control change follows if the base case slips?
      concept_families:
      - dilution
      - down_round
      - preference
      - control_shift
      typical_evidence:
      - cap-table scenarios
      - term sheets
      - waterfall
      - bridge options
      expected_case_outputs:
      - ModelNode
      - Risk
      - CaseReading
      proof_direction: Represent the path-dependent downside.
    - id: GF-CAP-05
      question: Does the company retain strategic options if public, private or debt markets close?
      concept_families:
      - financing_optionality
      - contingency
      - liquidity_buffer
      typical_evidence:
      - downside plan
      - cost actions
      - strategic alternatives
      - insider support
      expected_case_outputs:
      - Risk
      - WorkItem
      - Condition
      proof_direction: Test whether the company can choose rather than merely survive.
    reasoning_operators:
    - CASH_RUNWAY
    - CAPITAL_TO_BREAKEVEN
    - FINANCING_PATH
    - DEBT_CAPACITY
    - DILUTION
    - CONTINGENCY
    failure_modes:
    - growth plan requires an unmodeled financing
    - working capital or inventory absorbs cash before revenue
    - market closure forces a punitive bridge or recapitalization
    - insider support is assumed rather than evidenced
    - liquidity risk and valuation risk compound
    model_bindings:
    - cash
    - burn
    - runway
    - working_capital
    - capex
    - debt
    - next_round
    - dilution
  VALUATION_RETURNS_AND_LIQUIDITY:
    governing_question: What outcome distribution does the entry security create after realistic growth, margin, capital,
      dilution and liquidity assumptions?
    first_principles_rationale: Growth returns are especially exposed to duration and multiple. Valuation must be
      linked to the quality and persistence of the operating engine, future capital needs and the security's path
      to liquidity.
    question_families:
    - id: GF-RET-01
      question: What is the current valuation and security basis relative to actual, run-rate and forward economics?
      concept_families:
      - entry_valuation
      - security
      - actual_vs_forward_multiple
      typical_evidence:
      - term sheet
      - cap table
      - actuals
      - forecast
      expected_case_outputs:
      - MetricObservation
      - Definition
      - CaseReading
      proof_direction: Keep actual, run-rate and forecast denominators distinct.
    - id: GF-RET-02
      question: Which growth duration, margin, capital and dilution assumptions support the return?
      concept_families:
      - growth_duration
      - margin_path
      - capital_need
      - dilution
      typical_evidence:
      - integrated model
      - scenario bridge
      - capital plan
      expected_case_outputs:
      - Assumption
      - ModelNode
      - Risk
      proof_direction: Expose the operating assumptions embedded in price.
    - id: GF-RET-03
      question: What downside is produced by slower growth, weaker retention, lower margin, more capital or multiple
        compression?
      concept_families:
      - downside
      - sensitivity
      - multiple_compression
      - financing_downside
      typical_evidence:
      - scenario analysis
      - historical misses
      - public/private comparables
      expected_case_outputs:
      - ModelNode
      - CaseReading
      - Risk
      proof_direction: Use coherent downside states rather than isolated sensitivities alone.
    - id: GF-RET-04
      question: 'What liquidity route and timing are plausible: strategic sale, sponsor sale, IPO, secondary or continued
        private ownership?'
      concept_families:
      - exit_route
      - liquidity_timing
      - buyer_universe
      typical_evidence:
      - transaction evidence
      - public readiness
      - strategic buyer map
      - secondary market
      expected_case_outputs:
      - Assumption
      - Condition
      - CaseReading
      proof_direction: Treat liquidity as a conditional path with timing, execution and market dependencies.
    - id: GF-RET-05
      question: What rights, preferences, fees or secondary components alter the investor's actual payoff?
      concept_families:
      - security_rights
      - preference
      - fees
      - secondary
      typical_evidence:
      - legal terms
      - SPV terms
      - waterfall
      - cap table
      expected_case_outputs:
      - Definition
      - ModelNode
      - Condition
      proof_direction: Calculate the security return, not only enterprise value.
    reasoning_operators:
    - ACTUAL_VS_FORWARD_MULTIPLE
    - GROWTH_DURATION
    - SCENARIO
    - MULTIPLE_COMPRESSION
    - LIQUIDITY_PATH
    - WATERFALL
    failure_modes:
    - high growth hides weak current economics
    - return requires simultaneous success in growth, margin and multiple
    - exit timing is treated as certain
    - future financing and dilution are omitted
    - security economics differ from headline enterprise valuation
    model_bindings:
    - entry_value
    - revenue_or_profit_metric
    - growth
    - margin
    - dilution
    - exit_multiple
    - moic
    - irr
  REUNDERWRITING_AND_TRANSFORMATION:
    governing_question: What has the company proved, broken or changed, and what case is investable from today's state?
    first_principles_rationale: Growth cases evolve quickly. A re-underwrite must compare the original engine with
      actual cohorts, execution, capital use and strategic changes, rather than preserving the old thesis through
      narrative.
    question_families:
    - id: GF-REU-01
      question: Which original growth, retention, margin, financing and organizational assumptions are confirmed or
        contradicted?
      concept_families:
      - original_case
      - actual_vs_plan
      - assumption_outcome
      typical_evidence:
      - prior decision basis
      - actuals
      - cohorts
      - cash and organization history
      expected_case_outputs:
      - Outcome
      - CaseReading
      - Risk
      proof_direction: Replay the original state before updating the thesis.
    - id: GF-REU-02
      question: Has the core engine weakened, or has the constraint moved to a new segment, product, team or capacity
        layer?
      concept_families:
      - constraint_shift
      - core_engine
      - new_bottleneck
      typical_evidence:
      - segment performance
      - customer evidence
      - operating metrics
      - organization changes
      expected_case_outputs:
      - Question
      - CaseReading
      - WorkItem
      proof_direction: Distinguish thesis failure from a changed bottleneck.
    - id: GF-REU-03
      question: Does a revised plan describe a tested corrective mechanism or only a lower forecast?
      concept_families:
      - transformation_plan
      - corrective_mechanism
      - reacceleration
      typical_evidence:
      - initiative owner
      - milestone
      - leading indicator
      - cost and timing
      expected_case_outputs:
      - Assumption
      - Condition
      - WorkItem
      proof_direction: Require causal and owned corrective work.
    - id: GF-REU-04
      question: What is the incremental value and downside of additional capital, a bridge, secondary sale or transformation?
      concept_families:
      - incremental_return
      - bridge
      - secondary
      - transformation_value
      typical_evidence:
      - new terms
      - updated model
      - liquidity evidence
      - capital alternatives
      expected_case_outputs:
      - ModelNode
      - CaseReading
      - Condition
      proof_direction: Evaluate the new decision independently of sunk cost.
    - id: GF-REU-05
      question: What later evidence should reopen the revised case?
      concept_families:
      - reopen_rule
      - monitoring_trigger
      - decision_condition
      typical_evidence:
      - leading indicators
      - covenants
      - customer milestones
      - financing deadlines
      expected_case_outputs:
      - Condition
      - WorkItem
      - Outcome
      proof_direction: Turn the revised plan into a monitored case.
    reasoning_operators:
    - REPLAY
    - ACTUAL_VS_ASSUMPTION
    - BOTTLENECK_SHIFT
    - TRANSFORMATION_CAUSALITY
    - SUNK_COST_EXCLUSION
    - REOPEN_RULE
    failure_modes:
    - old thesis survives because one layer still looks positive
    - forecast reset is mistaken for corrective action
    - bridge capital funds time but not a mechanism
    - sunk cost or prior mark drives the new decision
    - new plan lacks leading indicators and reopening rules
    model_bindings:
    - actual_vs_plan
    - cohort_change
    - margin_change
    - cash_consumed
    - new_capital
    - incremental_return
