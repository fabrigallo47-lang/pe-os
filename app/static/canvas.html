<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PE OS — Agent Canvas</title>
<style>
:root{
  --bg:#0c1016; --grid:#131a24; --surface:#151c26; --surface2:#1b2431; --line:#26303f; --line-strong:#34404f;
  --ink:#eef2f7; --muted:#98a6b8; --faint:#6b7889;
  --accent:#c9a24b; --accent-ink:#0c1016; --green:#53b98a; --red:#e07a72; --blue:#7fa8cf;
  --serif:"Iowan Old Style",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
  --mono:"SF Mono",Menlo,monospace;
  --r:10px; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden;height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:16px;padding:0 20px;height:56px;border-bottom:1px solid var(--line);background:rgba(12,16,22,.9);backdrop-filter:blur(8px);z-index:10}
.wordmark{font-family:var(--serif);font-size:16px;letter-spacing:.02em}.wordmark b{color:var(--accent);font-weight:600}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{background:var(--accent);color:var(--accent-ink);border:none;border-radius:var(--r);padding:0 18px;font-weight:600;font-size:13px;height:38px;transition:opacity .15s ease}
.btn:hover{opacity:.9}
.btn.ghost{background:transparent;border:1px solid var(--line-strong);color:var(--ink)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
a{color:var(--faint);font-size:12.5px;text-decoration:none}a:hover{color:var(--ink)}
#palette{display:none}
.sideh{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin-bottom:8px;font-weight:600}
.palcol{display:flex;flex-direction:column;gap:6px}
.palcol .pal{width:100%;text-align:left;height:34px;border-radius:8px}
.pal{background:var(--surface);border:1px solid var(--line);color:var(--muted);border-radius:999px;padding:0 14px;height:32px;font-size:12px;font-weight:500;letter-spacing:.02em;transition:all .15s ease}
.pal:hover{color:var(--ink);border-color:var(--line-strong);background:var(--surface2)}
#board{position:relative;flex:1;overflow:auto;background-image:radial-gradient(circle,var(--grid) 1px,transparent 1px);background-size:28px 28px}
#wires{position:absolute;inset:0;width:3000px;height:2000px;pointer-events:none}
.node{position:absolute;width:224px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 12px;cursor:grab;user-select:none;box-shadow:var(--shadow);transition:border-color .15s ease}
.node:hover{border-color:var(--line-strong)}
.node:active{cursor:grabbing}
.node.fixed{background:linear-gradient(180deg,var(--surface2),var(--surface));border-color:var(--line-strong)}
.node h4{font-family:var(--serif);font-weight:500;font-size:14.5px;display:flex;align-items:center;gap:9px;letter-spacing:.01em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:0 0 auto;transition:background .2s ease}
@media (prefers-reduced-motion:no-preference){.dot.run{animation:pu 1.1s ease-in-out infinite}}
.dot.run{background:var(--accent)}@keyframes pu{50%{opacity:.35}}
.dot.ok{background:var(--green)}.dot.err{background:var(--red)}
.node .io{font-size:10.5px;color:var(--faint);margin-top:6px;line-height:1.55;letter-spacing:.01em}
.node .out{font-size:10.5px;color:var(--green);margin-top:8px;padding-top:8px;border-top:1px solid var(--line);white-space:pre-wrap;max-height:72px;overflow:auto;line-height:1.5}
.node .out:empty{display:none;border:none;padding:0;margin:0}
.port{position:absolute;width:15px;height:15px;border-radius:50%;background:var(--bg);border:2px solid var(--blue);cursor:crosshair;transition:transform .12s ease}
.port::after{content:"";position:absolute;inset:-10px}
.port.in{left:-9px;top:50%;transform:translateY(-50%)}
.port.outp{right:-9px;top:50%;transform:translateY(-50%);border-color:var(--accent)}
.port:hover{transform:translateY(-50%) scale(1.25);background:var(--accent)}
.del{position:absolute;top:8px;right:10px;color:var(--faint);cursor:pointer;font-size:12px;background:none;border:none;border-radius:6px;width:24px;height:24px}
.del:hover{color:var(--red);background:var(--surface2)}
.cfg{width:100%;margin-top:8px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;font-size:11.5px;padding:7px 9px}
label{font-size:10.5px;color:var(--muted)}
#hint{position:fixed;bottom:12px;left:20px;right:20px;font-size:11px;color:var(--faint);z-index:10;letter-spacing:.02em}
#panel{box-shadow:-16px 0 48px rgba(0,0,0,.5)!important;backdrop-filter:blur(10px)}
#panel h3{letter-spacing:.01em;margin-bottom:6px}
#panel h4{font-weight:600}
</style>
</head>
<body>
<header>
  <span class="wordmark"><b>◆</b> PE OS</span>
  <button class="pal" style="border-color:var(--accent);color:var(--accent)" onclick="showPanel(null)">Canvas</button>
  <button class="pal" onclick="showPanel('brain')">Brain · recent changes</button>
  <button class="pal" onclick="showPanel('coord')">Coordinator · reasonings</button>
  
  <span style="flex:1"></span>
  <input type="file" id="feed" style="display:none" onchange="feedUp(this)">
  <button class="btn ghost" onclick="document.getElementById('feed').click()">⇪ Feed data</button>
  <button class="btn ghost" id="save">Save flow</button>
  <button class="btn" id="run">Run flow</button>
  <a href="/">← desks</a>
</header>
<div id="shell" style="display:flex;flex:1;min-height:0">
  <aside id="side" style="width:224px;flex:0 0 224px;border-right:1px solid var(--line);background:var(--surface);overflow-y:auto;padding:16px 14px">
    <div class="sideh">Domain agents</div><div id="pal-domain" class="palcol"></div>
    <div class="sideh" style="margin-top:18px">Infrastructure</div><div id="pal-infra" class="palcol"></div>
    <div class="sideh" style="margin-top:18px">Control nodes</div><div id="pal-ctrl" class="palcol"></div>
  </aside>
  <div id="board" style="flex:1"><svg id="wires"></svg></div>
</div>
<div id="panel" style="display:none;position:fixed;top:62px;right:0;bottom:0;width:min(560px,92vw);background:rgba(21,28,38,.97);border-left:1px solid var(--accent);z-index:20;overflow:auto;padding:20px">
  <button class="pal" style="float:right" onclick="showPanel(null)">✕ close</button>
  <div id="panelbody" style="font-size:12.5px;line-height:1.6;white-space:pre-wrap;color:var(--muted)"></div>
</div>
<p id="hint">drag agents from the palette logic: gold port = output → drag to a blue input port to connect · double-click a wire to remove · every node reports to the coordinator and files to the brain automatically</p>
<script>
const DOMAIN = {
  "Financial / QoE":"financial_qoe", "Commercial / Market":"commercial_market", "Legal":"legal",
  "Tax":"tax", "Financing / Debt":"financing", "Operational":"operational",
  "Management / Sponsor":"management_sponsor", "Structuring":"structuring", "Valuation / Returns":"valuation_model",
};
const KINDS = {
  "sentinel":{io:"in: inbox artifact → out: ARTIFACT_ARRIVED event"},
  "extractor":{io:"in: artifact → out: typed claims bound to questions"},
  "contradiction":{io:"in: claims → out: contradiction flags"},
  "state-resolver":{io:"in: events → out: derived deal state"},
  "staleness":{io:"in: assumption change → out: stale flags"},
  "workstream":{io:"in: questions+assumptions+claims → out: findings", cfg:["commercial_market","financial_qoe","operational","management_sponsor","legal","financing"]},
  "ask":{io:"in: question → out: cited answer", cfgText:true},
  "human":{io:"human judgment node — the flow HOLDS here until a person approves (policy rows 7-8)", human:true},
  "external-event":{io:"external trigger (e.g. VDR arrives, pack received) — flow waits until it occurs", ext:true},
};
const FIXED = [
  {id:"coordinator", kind:"coordinator", x:1150, y:40, fixed:true, io:"main agent — sees every input & output, keeps the deal brief"},
  {id:"brain", kind:"librarian", x:1150, y:520, fixed:true, io:"the brain — every output is filed here by what it bears on"},
];
let flow = {nodes:[], edges:[]}, seq = 1, wireFrom = null;
const board = document.getElementById("board"), wires = document.getElementById("wires");
const api = async (p, o) => { const r = await fetch(p, o); const j = await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.detail||r.status); return j; };
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function nodeEl(n){
  const el = document.createElement("div");
  el.className = "node" + (n.fixed ? " fixed" : "");
  el.style.left = n.x+"px"; el.style.top = n.y+"px"; el.dataset.id = n.id;
  const k = KINDS[n.kind] || {io:n.io||""};
  let cfg = "";
  if (k.cfg) cfg = `<select class="cfg" onchange="setCfg('${n.id}','workstream',this.value)">` + k.cfg.map(o=>`<option ${n.config?.workstream===o?"selected":""}>${o}</option>`).join("") + `</select>`;
  if (k.human) cfg = `<label style="font-size:10px;color:var(--accent)"><input type="checkbox" ${n.config?.approved?"checked":""} onchange="setCfg('${n.id}','approved',this.checked)"> approved by human</label>`;
  if (k.ext) cfg = `<label style="font-size:10px;color:var(--blue)"><input type="checkbox" ${n.config?.occurred?"checked":""} onchange="setCfg('${n.id}','occurred',this.checked)"> event occurred</label><input class="cfg" placeholder="what event…" value="${esc(n.config?.event||'')}" onchange="setCfg('${n.id}','event',this.value)">`;
  if (k.cfgText) cfg = `<input class="cfg" placeholder="question…" value="${esc(n.config?.question||"")}" onchange="setCfg('${n.id}','question',this.value)">`;
  el.innerHTML = `<h4><span class="dot" id="dot-${n.id}"></span>${esc(n.label||n.kind)}${n.fixed?"":` <span style="color:var(--muted);font-size:10px">#${esc(n.id.split("_")[1]||"")}</span>`}</h4>
    <div class="io">${esc(n.io || k.io)}</div>${cfg}<div class="out" id="out-${n.id}"></div>
    ${n.fixed?"":'<button class="del" aria-label="delete" onclick="delNode(\''+n.id+'\')">✕</button>'}
    ${n.fixed?"":'<span class="port in" data-id="'+n.id+'"></span><span class="port outp" data-id="'+n.id+'"></span>'}`;
  // drag
  el.addEventListener("pointerdown", ev => {
    if (ev.target.classList.contains("port") || ev.target.tagName==="SELECT" || ev.target.tagName==="INPUT" || ev.target.classList.contains("del")) return;
    const sx = ev.clientX - n.x, sy = ev.clientY - n.y;
    const move = e => { n.x = e.clientX - sx; n.y = e.clientY - sy; el.style.left = n.x+"px"; el.style.top = n.y+"px"; draw(); };
    const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
    window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
  });
  return el;
}
window.setCfg = (id, key, val) => { const n = allNodes().find(x=>x.id===id); n.config = {...(n.config||{}), [key]: val}; };
window.delNode = id => { flow.nodes = flow.nodes.filter(n=>n.id!==id); flow.edges = flow.edges.filter(e=>e.from!==id&&e.to!==id); render(); };
const allNodes = () => [...FIXED, ...flow.nodes];

function render(){
  board.querySelectorAll(".node").forEach(x=>x.remove());
  allNodes().forEach(n => board.appendChild(nodeEl(n)));
  board.querySelectorAll(".port.outp").forEach(p => p.addEventListener("pointerdown", ev => { ev.stopPropagation(); wireFrom = p.dataset.id; }));
  board.querySelectorAll(".port.in").forEach(p => p.addEventListener("pointerup", ev => {
    if (wireFrom && wireFrom !== p.dataset.id){ flow.edges.push({from:wireFrom, to:p.dataset.id}); wireFrom = null; draw(); }
  }));
  window.addEventListener("pointerup", ()=>{ wireFrom=null; });
  draw();
}
function center(id, side){
  const n = allNodes().find(x=>x.id===id);
  return {x: n.x + (side==="out"?210:0), y: n.y + 34};
}
function draw(){
  let svg = "";
  // implicit governance wires: every user node ↔ coordinator + brain (faint)
  flow.nodes.forEach(n => {
    const a = center(n.id,"out");
    FIXED.forEach(f => { const b = {x:f.x, y:f.y+34};
      svg += `<path d="M${a.x},${a.y} C${(a.x+b.x)/2},${a.y} ${(a.x+b.x)/2},${b.y} ${b.x},${b.y}" stroke="#2a3b52" stroke-width="1" fill="none" stroke-dasharray="4 5"/>`; });
  });
  flow.edges.forEach((e,i) => {
    const a = center(e.from,"out"), b = center(e.to,"in");
    svg += `<path data-i="${i}" d="M${a.x},${a.y} C${(a.x+b.x)/2},${a.y} ${(a.x+b.x)/2},${b.y} ${b.x},${b.y}" stroke="var(--accent)" stroke-width="2.2" fill="none" style="pointer-events:stroke;cursor:pointer"/>`;
  });
  wires.innerHTML = svg;
  wires.querySelectorAll("path[data-i]").forEach(p => p.addEventListener("dblclick", ()=>{ flow.edges.splice(+p.dataset.i,1); draw(); }));
}
// palette
const palD = document.getElementById("pal-domain"), palI = document.getElementById("pal-infra"), palC = document.getElementById("pal-ctrl");
Object.entries(DOMAIN).forEach(([label, ws]) => {
  const b = document.createElement("button"); b.className = "pal"; b.style.borderColor = "var(--gold)"; b.textContent = "+ " + label;
  b.onclick = () => { flow.nodes.push({id:`ws_${seq++}`, kind:"workstream", label, x:80+Math.random()*260, y:80+Math.random()*320,
    config:{workstream:ws}, io:`in: questions+assumptions+claims → out: ${label} findings tied to assumptions`}); render(); };
  palD.appendChild(b);
});
Object.keys(KINDS).filter(k=>k!=="workstream").forEach(k => {
  const b = document.createElement("button"); b.className = "pal"; b.textContent = "+ " + k;
  b.onclick = () => { flow.nodes.push({id:`${k}_${seq++}`, kind:k, x:80+Math.random()*200, y:80+Math.random()*300, config:{}}); render(); };
  (k==="human"||k==="external-event" ? palC : palI).appendChild(b);
});
// run: topological order over user edges, sources first
document.getElementById("run").onclick = async () => {
  const btn = document.getElementById("run"); btn.disabled = true;
  const order = [], seen = new Set();
  const visit = id => { if (seen.has(id)) return; seen.add(id);
    flow.edges.filter(e=>e.to===id).forEach(e=>visit(e.from)); order.push(id); };
  flow.nodes.forEach(n=>visit(n.id));
  for (const id of order){
    const n = flow.nodes.find(x=>x.id===id); if(!n) continue;
    const dot = document.getElementById("dot-"+id), out = document.getElementById("out-"+id);
    if (n.kind === "human"){ if(n.config?.approved){ dot.className="dot ok"; out.textContent="changed: approval recorded · opened: downstream may proceed"; } else { dot.className="dot err"; out.textContent="HELD — awaiting human approval"; break; } continue; }
    if (n.kind === "external-event"){ if(n.config?.occurred){ dot.className="dot ok"; out.textContent=`changed: ${n.config?.event||"event"} occurred · opened: downstream`; } else { dot.className="dot err"; out.textContent=`waiting: ${n.config?.event||"external event"}`; break; } continue; }
    dot.className = "dot run"; out.textContent = "running…";
    try { const r = await api(`/api/agents/run/${n.kind}`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({config:n.config||{}})});
      dot.className = "dot ok"; out.textContent = r.summary; }
    catch(e){ dot.className = "dot err"; out.textContent = e.message; }
  }
  // coordinator + brain always close the cycle
  for (const f of FIXED){
    const dot = document.getElementById("dot-"+f.id); dot.className = "dot run";
    try { await api(`/api/agents/run/${f.kind}`, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({config:{}})}); dot.className="dot ok"; }
    catch(e){ dot.className="dot err"; }
  }
  btn.disabled = false;
};
window.showPanel = async which => {
  const pn = document.getElementById("panel"), pb = document.getElementById("panelbody");
  if (!which){ pn.style.display = "none"; return; }
  pn.style.display = "block"; pb.textContent = "loading…";
  try {
    if (which === "brain"){
      const items = await api("/api/brain");
      pb.innerHTML = "<h3 style='color:var(--ink);font-family:var(--serif)'>Firm brain — archives (librarian-maintained)</h3>" +
        items.map(it=>`<h4 style="color:var(--accent);margin:14px 0 4px">${esc(it.name)} · ${esc(it.kind)}</h4><div>${esc(it.content.split("---").pop().trim().slice(0,900))}</div>`).join("");
    } else {
      const d = await api("/api/coordinator");
      pb.innerHTML = "<h3 style='color:var(--ink);font-family:var(--serif)'>Coordinator — latest briefs</h3>" +
        d.briefs.map(b=>`<h4 style="color:var(--accent);margin:14px 0 4px">${esc(b.deal)}</h4><div>${esc(b.brief)}</div>`).join("") +
        "<h3 style='color:var(--ink);font-family:var(--serif);margin-top:20px'>Recent reasonings (audit)</h3>" +
        d.reasonings.map(r=>`<div style="margin:6px 0"><span style="color:var(--green)">${esc(r.ts.replace("T"," "))}</span> <b style="color:var(--ink)">${esc(r.agent)}</b> · ${esc(r.action)} — ${esc(r.detail)}</div>`).join("");
    }
  } catch(e){ pb.textContent = "error: " + e.message; }
};
window.feedUp = async inp => {
  const f = inp.files[0]; if(!f) return;
  const fd = new FormData(); fd.append("file", f);
  try { const r = await api("/api/upload", {method:"POST", body:fd});
    alert(`stored: ${r.stored}\n${r.note}\nNow run a flow with extractor (or a domain agent) to process it.`); }
  catch(e){ alert("upload failed: "+e.message); }
  inp.value = "";
};
document.getElementById("save").onclick = async () => {
  await api("/api/flow", {method:"PUT", headers:{"Content-Type":"application/json"}, body:JSON.stringify(flow)});
  document.getElementById("save").textContent = "Saved ✓"; setTimeout(()=>document.getElementById("save").textContent="Save flow", 1500);
};
(async () => { try { const f = await api("/api/flow"); if (f.nodes) flow = f; seq = flow.nodes.length+1; } catch(e){} render(); })();
</script>
</body>
</html>
