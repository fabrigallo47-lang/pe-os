    - data rights
    - regulatory condition
    - security
    - closing terms
    completion_semantics: Produces evidence or analysis candidates; completion does not imply evidence sufficiency
      or Question closure.
  FOLLOW_ON_REUNDERWRITING:
    cost_band: FUND_CONFIGURED
    duration_band: FUND_CONFIGURED
    artifact_optional: true
    can_address_question_classes:
    - original case replay
    - milestone outcomes
    - new risks
    - incremental return
    completion_semantics: Produces evidence or analysis candidates; completion does not imply evidence sufficiency
      or Question closure.
compiler_use:
  routing_rule: Use stage, workstream and concept families to route extraction. Never infer identity from category.
  binding_rule: Bind material Claims first to Questions; bind to CaseReadings, Assumptions, Conditions or ModelNodes
    only when semantic direction and identity are resolved.
  new_structure_rule: Propose a new Question, concept or milestone when material evidence cannot be represented by
    the configured pack.
  day_zero_rule: Create the Question and Unknown structure without inventing StatedPositions or a positive CaseReading.
  stage_rule: Absence of mature metrics may be stage-appropriate; the Compiler must instead expose the next evidence
    state required.
  question_activation_rule: Use the shared activation contract to form a bounded decision-bearing spine; never instantiate
    every family.
  module_rule: Select maturity, business-model, sector and transaction modules independently and preserve every origin.
  tool_rule: A completed method may add evidence, CoverageLimits or WorkItems; it cannot automatically close a Question.
  concept_activation_rule: Canonical concept seeds are available vocabulary, not compulsory fields. Activate only
    those made applicable by the Deal Frame, active modules, source evidence or model dependencies.
non_goals:
- Treat founder quality, TAM and syndicate reputation as sufficient underwriting.
- Require revenue or mature unit economics at every venture stage.
- Treat a pilot, letter of intent, backlog, booking and recognized revenue as the same state.
- Encode one institution's ticket, ownership, hurdle, evidence bar or IC process.
- Use probability-weighted returns as an automatic Decision.
- Prevent deal-specific Questions or sector modules from being proposed.
- Treat a business model as a sector or a sector as a business model.
- Store empirical corpus counts or institution-specific validation metadata in the production pack.
- Duplicate maturity, business-model, sector or transaction module definitions inside the pack.
- Treat completion of a diligence method or artifact as closure of an underwriting Question.
- Represent deal sourcing, fundraising, limited-partner relations or the complete investment-firm operating model.
- Replace a dedicated ownership, portfolio-monitoring or operating-value-creation system beyond case re-underwriting.
- Treat every canonical concept seed as an active metric or required data field.
- Force a debt-dominant, control-buyout or asset-level infrastructure case into Venture or Growth.
archetype_boundary:
  definition: Reusable Venture economics and epistemology, not the preferences of one institution.
  inclusion_test:
  - The item remains relevant for another competent investor facing the same stage and transaction.
  - The item follows from sparse evidence, milestone dependence, financing path, ownership or venture loss mechanics.
  - The item survives changes in committee, ticket, threshold, template, provider and cadence.
  excluded_to_fund_lens:
  - minimum ownership and ticket
  - return hurdle and scenario weights
  - required runway or evidence threshold
  - reserve and follow-on allocation policy
  - sector mandate and exclusions
  - authority, committee and board-seat policy
  - preferred investors, advisers or providers
  - artifact format and process cadence
  excluded_to_deal_state:
  - specific company facts, sources, people, values, dates, terms, milestones and decisions
  evidence_examples_rule: Evidence lists guide retrieval and work design. They are non-exhaustive and never constitute
    mandatory sufficiency or automatic closure.
