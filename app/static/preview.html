<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PANTA — Future Investment Operating System</title>
  <style>:root{
  --bg:#02060a;
  --bg2:#061019;
  --panel:rgba(6,15,22,.76);
  --panel2:rgba(8,21,30,.9);
  --panel3:rgba(12,27,38,.74);
  --line:rgba(126,220,255,.16);
  --line2:rgba(126,220,255,.28);
  --text:#edf8ff;
  --muted:#7993a2;
  --faint:#47606f;
  --cyan:#56e7ff;
  --teal:#46ffd0;
  --green:#68ff9f;
  --amber:#ffbd57;
  --red:#ff5576;
  --violet:#a985ff;
  --blue:#7db6ff;
  --white:#fff;
  --shadow:0 24px 80px rgba(0,0,0,.48);
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:1000;opacity:.16;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 160 160' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.18'/%3E%3C/svg%3E");mix-blend-mode:soft-light}
body:after{content:"";position:fixed;inset:0;pointer-events:none;z-index:999;background:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px);background-size:100% 4px;opacity:.22}
button,input{font:inherit}
.app{position:relative;width:100vw;height:100vh;isolation:isolate;background:radial-gradient(circle at 54% 44%,rgba(33,86,106,.16),transparent 36%),radial-gradient(circle at 82% 12%,rgba(94,51,150,.09),transparent 28%),linear-gradient(180deg,#02070b 0%,#02060a 100%)}
#field{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.vignette{position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(circle at 52% 46%,transparent 0 38%,rgba(0,0,0,.25) 68%,rgba(0,0,0,.74) 100%)}
.topbar{position:absolute;z-index:20;top:0;left:0;right:0;height:70px;display:flex;align-items:center;padding:0 28px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,rgba(2,7,11,.94),rgba(2,7,11,.52));backdrop-filter:blur(18px)}
.brand{display:flex;align-items:center;gap:12px;min-width:205px}
.brand-mark{width:28px;height:28px;position:relative;border:1px solid rgba(86,231,255,.42);border-radius:8px;box-shadow:0 0 24px rgba(86,231,255,.12) inset}
.brand-mark:before,.brand-mark:after{content:"";position:absolute;background:var(--cyan);box-shadow:0 0 14px var(--cyan)}
.brand-mark:before{width:11px;height:1px;left:8px;top:13px;transform:rotate(42deg)}
.brand-mark:after{width:11px;height:1px;left:8px;top:13px;transform:rotate(-42deg)}
.brand-name{font-weight:760;letter-spacing:.18em;font-size:12px}
.context{display:flex;align-items:center;gap:10px;flex:1}
.context .crumb{font-size:11px;color:var(--muted);letter-spacing:.03em}
.context .major{font-size:13px;color:var(--text);font-weight:650}
.context .slash{color:#2b4453}
.top-actions{display:flex;align-items:center;gap:12px}
.live-pill,.mode-pill,.authority-pill{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line2);border-radius:999px;background:rgba(8,21,30,.68);font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.live-pill i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 12px var(--green);animation:pulse 2s infinite}
.authority-pill{color:#b7d3df}.authority-pill b{color:var(--text)}
.clock{font-size:11px;color:#aac0cb;letter-spacing:.08em}
.lifecycle{position:absolute;z-index:18;top:70px;left:88px;right:28px;height:46px;display:flex;align-items:center;gap:0;border-bottom:1px solid rgba(126,220,255,.09)}
.phase{position:relative;flex:1;display:flex;align-items:center;gap:8px;height:100%;color:#415c6b;font-size:9px;text-transform:uppercase;letter-spacing:.1em}
.phase:before{content:"";width:7px;height:7px;border-radius:50%;border:1px solid #365261;background:#061019;z-index:2}
.phase:after{content:"";position:absolute;left:10px;right:0;top:22px;height:1px;background:#1a3443}
.phase:last-child:after{display:none}
.phase.done{color:#8fa7b4}.phase.done:before{background:var(--green);border-color:var(--green);box-shadow:0 0 10px rgba(104,255,159,.55)}
.phase.active{color:var(--text)}.phase.active:before{background:var(--cyan);border-color:var(--cyan);box-shadow:0 0 16px rgba(86,231,255,.75)}
.phase.warn:before{background:var(--amber);border-color:var(--amber);box-shadow:0 0 16px rgba(255,189,87,.7)}
.rail{position:absolute;z-index:24;top:70px;bottom:0;left:0;width:64px;border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:18px 0 14px;background:linear-gradient(90deg,rgba(2,7,11,.98),rgba(2,7,11,.58));backdrop-filter:blur(18px)}
.rail-btn{position:relative;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:#547180;margin-bottom:8px;border:1px solid transparent}
.rail-btn:before{content:"";width:13px;height:13px;border:1.5px solid currentColor;border-radius:4px;transform:rotate(45deg)}
.rail-btn.active{color:var(--cyan);background:rgba(86,231,255,.08);border-color:rgba(86,231,255,.18);box-shadow:0 0 28px rgba(86,231,255,.08)}
.rail-spacer{flex:1}
.rail-avatar{width:30px;height:30px;border:1px solid rgba(86,231,255,.3);border-radius:50%;display:grid;place-items:center;font-size:9px;color:#ccebf3;background:#07141d}
.stage{position:absolute;z-index:2;left:64px;right:0;top:116px;bottom:54px;overflow:hidden}
.bottomline{position:absolute;z-index:20;left:64px;right:0;bottom:0;height:54px;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 24px;background:linear-gradient(0deg,rgba(2,7,11,.96),rgba(2,7,11,.5));backdrop-filter:blur(18px)}
.flow-status{display:flex;align-items:center;gap:22px;font-size:10px;color:var(--muted)}
.flow-status span{display:flex;align-items:center;gap:7px}.flow-status i{width:6px;height:6px;border-radius:50%;background:#365261}.flow-status .ok i{background:var(--green);box-shadow:0 0 9px rgba(104,255,159,.55)}.flow-status .warn i{background:var(--amber);box-shadow:0 0 9px rgba(255,189,87,.55)}
.system-health{margin-left:auto;display:flex;align-items:center;gap:11px;font-size:9px;color:#688493;text-transform:uppercase;letter-spacing:.08em}.health-bar{width:112px;height:3px;border-radius:5px;background:#102633;overflow:hidden}.health-bar b{display:block;width:86%;height:100%;background:linear-gradient(90deg,var(--cyan),var(--green));box-shadow:0 0 10px rgba(86,231,255,.5)}
.overlay{position:absolute;inset:0;z-index:10;pointer-events:none}
.overlay *{pointer-events:auto}
.glass{background:linear-gradient(145deg,rgba(9,23,33,.84),rgba(4,12,18,.66));border:1px solid rgba(126,220,255,.16);box-shadow:var(--shadow),inset 0 1px 0 rgba(255,255,255,.025);backdrop-filter:blur(18px)}
.panel{position:absolute;border-radius:16px;overflow:hidden}
.panel-head{height:48px;padding:0 16px;display:flex;align-items:center;border-bottom:1px solid rgba(126,220,255,.1);font-size:10px;color:#91acb9;text-transform:uppercase;letter-spacing:.1em}
.panel-head b{color:var(--text);font-size:11px;letter-spacing:.04em;text-transform:none}.panel-head .grow{flex:1}.panel-head .tiny{font-size:8px;color:#526d7a}
.panel-body{padding:14px 16px}
.eyebrow{font-size:9px;color:var(--cyan);letter-spacing:.16em;text-transform:uppercase;margin-bottom:8px}
.hero-title{font-size:27px;font-weight:650;letter-spacing:-.035em;line-height:1.05}.hero-title em{font-style:normal;color:var(--cyan)}
.subtext{font-size:11px;line-height:1.5;color:#7f9aa8}
.kpi-row{display:flex;gap:9px}.kpi{min-width:105px;padding:11px 12px;border-radius:12px;background:rgba(6,19,27,.72);border:1px solid rgba(126,220,255,.11)}.kpi label{display:block;font-size:8px;color:#637d8b;text-transform:uppercase;letter-spacing:.09em;margin-bottom:6px}.kpi strong{font-size:18px;font-weight:600}.kpi .delta{font-size:9px;margin-left:5px}.negative{color:var(--red)}.positive{color:var(--green)}.amber{color:var(--amber)}.cyan{color:var(--cyan)}.violet{color:var(--violet)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:999px;border:1px solid rgba(126,220,255,.15);background:rgba(7,21,30,.72);font-size:8px;color:#86a0ae;text-transform:uppercase;letter-spacing:.08em}.chip i{width:5px;height:5px;border-radius:50%;background:currentColor}.chip.ok{color:var(--green);border-color:rgba(104,255,159,.24)}.chip.warn{color:var(--amber);border-color:rgba(255,189,87,.24)}.chip.bad{color:var(--red);border-color:rgba(255,85,118,.24)}.chip.info{color:var(--cyan);border-color:rgba(86,231,255,.24)}.chip.purple{color:var(--violet);border-color:rgba(169,133,255,.24)}
.btn{border:1px solid rgba(126,220,255,.18);border-radius:10px;background:rgba(8,24,34,.8);color:#a9c1cd;padding:9px 13px;font-size:9px;letter-spacing:.05em;cursor:pointer}.btn:hover{border-color:rgba(86,231,255,.44);color:var(--text)}.btn.primary{background:linear-gradient(135deg,rgba(86,231,255,.18),rgba(70,255,208,.1));border-color:rgba(86,231,255,.42);color:#dffaff;box-shadow:0 0 24px rgba(86,231,255,.08)}.btn.approve{background:rgba(104,255,159,.12);border-color:rgba(104,255,159,.38);color:#aaffc5}.btn.danger{background:rgba(255,85,118,.1);border-color:rgba(255,85,118,.36);color:#ff98ab}
.list{display:flex;flex-direction:column;gap:7px}.list-item{position:relative;padding:11px 12px;border-radius:11px;background:rgba(6,18,26,.62);border:1px solid rgba(126,220,255,.09);display:flex;align-items:center;gap:10px}.list-item:before{content:"";width:5px;height:5px;border-radius:50%;background:#496878}.list-item.ok:before{background:var(--green);box-shadow:0 0 9px rgba(104,255,159,.55)}.list-item.warn:before{background:var(--amber);box-shadow:0 0 9px rgba(255,189,87,.55)}.list-item.bad:before{background:var(--red);box-shadow:0 0 9px rgba(255,85,118,.55)}.list-item .main{flex:1}.list-item b{display:block;font-size:10px;font-weight:550}.list-item small{display:block;font-size:8px;color:#617d8b;margin-top:3px}.list-item .right{font-size:9px;color:#8ca6b3}
.rule{height:1px;background:linear-gradient(90deg,transparent,rgba(126,220,255,.16),transparent);margin:12px 0}
.micro-label{font-size:8px;text-transform:uppercase;letter-spacing:.11em;color:#58717f}
.big-number{font-size:42px;line-height:.9;font-weight:520;letter-spacing:-.055em}.big-number small{font-size:14px;color:#748d9b}
.scene-label{position:absolute;left:30px;top:24px;font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#698796}.scene-label b{color:var(--text)}
.hud-corner{position:absolute;width:22px;height:22px;border-color:rgba(86,231,255,.28);border-style:solid;pointer-events:none}.hud-corner.tl{left:10px;top:10px;border-width:1px 0 0 1px}.hud-corner.tr{right:10px;top:10px;border-width:1px 1px 0 0}.hud-corner.bl{left:10px;bottom:10px;border-width:0 0 1px 1px}.hud-corner.br{right:10px;bottom:10px;border-width:0 1px 1px 0}
.toast{position:absolute;right:28px;top:28px;padding:12px 14px;border-radius:12px;background:rgba(6,17,25,.88);border:1px solid rgba(86,231,255,.24);box-shadow:0 18px 50px rgba(0,0,0,.38);font-size:10px;color:#a7c3ce}.toast b{color:var(--text)}
.scan{position:absolute;inset:0;pointer-events:none;overflow:hidden}.scan:after{content:"";position:absolute;left:-20%;right:-20%;height:1px;top:-5%;background:linear-gradient(90deg,transparent,rgba(86,231,255,.65),transparent);box-shadow:0 0 20px rgba(86,231,255,.45);animation:scan 7s linear infinite}
@keyframes scan{to{top:105%}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.88)}50%{opacity:1;transform:scale(1.2)}}
@keyframes breathe{0%,100%{opacity:.52}50%{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(220%)}}
@keyframes countdown{from{stroke-dashoffset:0}to{stroke-dashoffset:126}}

/* View-specific reusable components */
.lensbar{position:absolute;left:50%;transform:translateX(-50%);top:20px;display:flex;gap:7px;padding:6px;border-radius:999px;background:rgba(4,13,20,.62);border:1px solid rgba(126,220,255,.13);backdrop-filter:blur(14px)}
.lens{padding:7px 11px;border-radius:999px;font-size:8px;color:#5e7c8b;text-transform:uppercase;letter-spacing:.08em}.lens.active{color:#dffaff;background:rgba(86,231,255,.11);box-shadow:0 0 18px rgba(86,231,255,.08) inset}
.signal-stack{position:absolute;left:22px;top:30px;width:258px;display:flex;flex-direction:column;gap:8px}.signal-card{padding:12px;border-radius:13px;background:rgba(5,15,22,.7);border:1px solid rgba(126,220,255,.1);backdrop-filter:blur(14px)}.signal-card .top{display:flex;align-items:center;gap:8px}.signal-card .dot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 12px currentColor}.signal-card b{font-size:10px}.signal-card small{display:block;color:#617d8b;font-size:8px;margin-top:5px;line-height:1.4}.signal-card.warn{border-color:rgba(255,189,87,.18)}.signal-card.warn .dot{background:var(--amber)}.signal-card.bad{border-color:rgba(255,85,118,.2)}.signal-card.bad .dot{background:var(--red)}
.agent-dock{position:absolute;right:24px;top:30px;width:290px;padding:14px;border-radius:16px}.agent-dock h3{font-size:10px;margin:0;color:#b7cfda;font-weight:600}.agent-line{display:flex;align-items:center;gap:9px;padding:10px 0;border-bottom:1px solid rgba(126,220,255,.08)}.agent-line:last-child{border-bottom:0}.agent-glyph{width:28px;height:28px;border-radius:10px;border:1px solid rgba(169,133,255,.25);background:rgba(169,133,255,.07);display:grid;place-items:center;color:var(--violet);font-size:9px}.agent-line .copy{flex:1}.agent-line b{display:block;font-size:9px}.agent-line small{display:block;font-size:8px;color:#647f8d;margin-top:3px}.agent-line .state{font-size:8px;color:var(--green)}
.deal-anchor{position:absolute;left:50%;top:49%;transform:translate(-50%,-50%);text-align:center;pointer-events:none}.deal-anchor .ring{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(86,231,255,.22);box-shadow:0 0 50px rgba(86,231,255,.06) inset}.deal-anchor .r1{width:150px;height:150px;animation:spin 20s linear infinite}.deal-anchor .r2{width:228px;height:228px;border-style:dashed;animation:spinReverse 32s linear infinite}.deal-anchor .r3{width:318px;height:318px;opacity:.45}.deal-core{position:relative;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 38% 30%,rgba(255,255,255,.19),rgba(86,231,255,.14) 20%,rgba(6,19,28,.95) 68%);border:1px solid rgba(86,231,255,.45);box-shadow:0 0 55px rgba(86,231,255,.15),inset 0 0 38px rgba(86,231,255,.08)}.deal-core b{font-size:11px;letter-spacing:.12em}.deal-core span{font-size:8px;color:#7594a2}.deal-anchor .caption{margin-top:20px;font-size:9px;color:#728f9d;text-transform:uppercase;letter-spacing:.13em}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}@keyframes spinReverse{to{transform:translate(-50%,-50%) rotate(-360deg)}}
.spine-banner{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:999px;background:rgba(5,16,23,.72);border:1px solid rgba(126,220,255,.12);font-size:9px;color:#6d8997}.spine-banner b{color:#ccebf3}
.metric-float{position:absolute;min-width:138px;padding:10px 12px;border-radius:12px;background:rgba(5,16,23,.72);border:1px solid rgba(126,220,255,.1);backdrop-filter:blur(12px)}.metric-float label{display:block;font-size:7px;text-transform:uppercase;letter-spacing:.1em;color:#577382}.metric-float strong{display:block;font-size:17px;margin-top:4px;font-weight:520}.metric-float small{font-size:8px;color:#6e8997}.metric-float:after{content:"";position:absolute;width:65px;height:1px;background:linear-gradient(90deg,rgba(86,231,255,.3),transparent)}
.modal-center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1180px;height:650px;border-radius:22px;overflow:hidden}
.split{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.diff-row{display:grid;grid-template-columns:1.4fr .7fr .7fr .65fr;gap:8px;align-items:center;padding:9px 10px;border-radius:10px;background:rgba(5,16,24,.62);border:1px solid rgba(126,220,255,.08);font-size:9px}.diff-row header{display:none}.diff-row .name{color:#bdd2dc}.diff-row .old{color:#708a97;text-decoration:line-through}.diff-row .new{color:#eaf8ff}.diff-row .state{text-align:right}.diff-row .state span{padding:4px 6px;border-radius:999px;font-size:7px;text-transform:uppercase;letter-spacing:.07em}.state .auto{background:rgba(104,255,159,.1);color:var(--green)}.state .review{background:rgba(255,189,87,.1);color:var(--amber)}.state .blocked{background:rgba(255,85,118,.1);color:var(--red)}
.coa-card{position:relative;padding:18px;border-radius:17px;background:linear-gradient(145deg,rgba(8,23,33,.83),rgba(4,12,18,.73));border:1px solid rgba(126,220,255,.13);overflow:hidden}.coa-card.recommended{border-color:rgba(104,255,159,.35);box-shadow:0 0 45px rgba(104,255,159,.08)}.coa-card.recommended:before{content:"RECOMMENDED";position:absolute;top:13px;right:13px;font-size:7px;letter-spacing:.12em;color:var(--green)}.coa-card h3{font-size:18px;margin:0 0 5px}.coa-card p{font-size:9px;line-height:1.5;color:#718d9b}.coa-metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.coa-metric{padding:9px;border-radius:10px;background:rgba(2,10,15,.5);border:1px solid rgba(126,220,255,.08)}.coa-metric label{display:block;font-size:7px;color:#5b7582;text-transform:uppercase}.coa-metric strong{display:block;font-size:15px;margin-top:5px}.coa-list{display:flex;flex-direction:column;gap:7px;margin:12px 0}.coa-list span{font-size:9px;color:#89a3b0}.coa-list span:before{content:"•";color:var(--cyan);margin-right:7px}
.freeze-stamp{position:absolute;right:20px;bottom:20px;width:130px;height:130px;border-radius:50%;border:1px solid rgba(104,255,159,.4);display:grid;place-items:center;text-align:center;color:var(--green);font-size:8px;letter-spacing:.12em;text-transform:uppercase;transform:rotate(-8deg);opacity:.9;box-shadow:0 0 40px rgba(104,255,159,.09) inset}.freeze-stamp:before{content:"";position:absolute;inset:8px;border:1px dashed rgba(104,255,159,.28);border-radius:50%}
.timeline-branch{position:relative;height:220px}.timeline-branch .axis{position:absolute;left:20px;right:20px;top:50%;height:1px;background:rgba(126,220,255,.15)}.branch-line{position:absolute;height:2px;transform-origin:left center;border-radius:2px;background:linear-gradient(90deg,var(--cyan),var(--green));box-shadow:0 0 12px rgba(86,231,255,.25)}.branch-node{position:absolute;width:10px;height:10px;border-radius:50%;border:2px solid currentColor;background:#051018;box-shadow:0 0 15px currentColor}.branch-label{position:absolute;font-size:8px;color:#7794a2}.branch-label b{color:#cbe4ee}

@media(max-width:1200px){.hero-title{font-size:22px}.agent-dock{width:250px}.signal-stack{width:230px}}

/* 60-second simulation */
.scene-wrap{position:absolute;inset:0;opacity:0;transform:translateY(8px) scale(.995);animation:sceneEnter .62s cubic-bezier(.2,.75,.2,1) forwards}
@keyframes sceneEnter{to{opacity:1;transform:translateY(0) scale(1)}}
.demo-progress{position:absolute;z-index:40;left:64px;right:0;bottom:54px;height:3px;background:rgba(126,220,255,.08)}
.demo-progress b{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--cyan),var(--violet),var(--green));box-shadow:0 0 14px rgba(86,231,255,.55)}
.demo-counter{position:absolute;z-index:45;right:26px;bottom:68px;font-size:9px;letter-spacing:.1em;color:#6d8997;text-transform:uppercase}
.demo-counter b{color:#cfe8f0}
.demo-caption{position:absolute;left:50%;transform:translateX(-50%);top:24px;min-width:540px;text-align:center;pointer-events:none}

<body>
<div class="app">
  <canvas id="field"></canvas>
  <div class="vignette"></div>
  <header class="topbar">

    <div class="context" id="context"></div>

      <div class="authority-pill">Authority <b id="authorityName">Associate</b></div>

      <div class="clock" id="clock">09:41:18 UTC</div>
    </div>
  </header>
  <div class="lifecycle" id="lifecycle"></div>
  <aside class="rail">
    <div class="rail-btn active"></div><div class="rail-btn"></div><div class="rail-btn"></div><div class="rail-btn"></div><div class="rail-btn"></div>
    <div class="rail-spacer"></div><div class="rail-avatar">AM</div>
  </aside>
  <main class="stage">

  </main>
  <footer class="bottomline">
    <div class="flow-status" id="flowStatus"></div>
    <div class="system-health"><span>Investment state coherence</span><div class="health-bar"><b></b></div><strong>86%</strong></div>
  </footer>
</div>
<script>(function(){
  const canvas = document.getElementById('field');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  let w=0,h=0,dpr=1, mode='rest', opts={}, modeStart=performance.now();
  let particles=[];
  const C={cyan:'#56e7ff',teal:'#46ffd0',green:'#68ff9f',amber:'#ffbd57',red:'#ff5576',violet:'#a985ff',blue:'#7db6ff',muted:'#547483',bg:'#02060a'};

  function resize(){
    dpr=Math.min(window.devicePixelRatio||1,1.5);
    w=window.innerWidth; h=window.innerHeight;
    canvas.width=Math.floor(w*dpr); canvas.height=Math.floor(h*dpr);
    canvas.style.width=w+'px'; canvas.style.height=h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    particles=Array.from({length:110},()=>({x:Math.random()*w,y:Math.random()*h,z:Math.random(),s:.25+Math.random()*1.2,p:Math.random()*Math.PI*2}));
  }
  window.addEventListener('resize',resize); resize();

  function setMode(m,o={}){mode=m;opts=o;modeStart=performance.now();}
  window.PantaField={setMode,getMode:()=>mode,updateNodes:(u)=>{for(const n of defaultNodes)if(u[n.id])n.value=u[n.id];}};

  function lerp(a,b,t){return a+(b-a)*t}
  function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
  function rgba(hex,a){
    const v=hex.replace('#',''); const n=parseInt(v,16); return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
  }
  function glow(color,blur=18){ctx.shadowColor=color;ctx.shadowBlur=blur}
  function noGlow(){ctx.shadowBlur=0;ctx.shadowColor='transparent'}
  function stage(){return {x:64,y:116,w:w-64,h:h-170,cx:64+(w-64)*.53,cy:116+(h-170)*.50}}

  function background(t){
    const s=stage();
    ctx.clearRect(0,0,w,h);
    // soft nebula
    let g=ctx.createRadialGradient(s.cx,s.cy,10,s.cx,s.cy,Math.max(s.w,s.h)*.48);
    g.addColorStop(0,'rgba(30,89,105,.11)');g.addColorStop(.45,'rgba(8,33,44,.05)');g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
    // particles
    ctx.save();
    for(const p of particles){
      const a=.08+.18*(.5+.5*Math.sin(t*.00045+p.p));
      ctx.fillStyle=`rgba(145,220,238,${a*p.z})`;
      ctx.fillRect(p.x,p.y,p.s,p.s);
    }
    ctx.restore();
    drawGrid(t);
  }

  function drawGrid(t){
    const s=stage(); const horizon=s.y+s.h*.36; const bottom=s.y+s.h*1.03;
    ctx.save();ctx.lineWidth=1;
    // horizon glow
    let hg=ctx.createLinearGradient(s.x,horizon,s.x+s.w,horizon);
    hg.addColorStop(0,'rgba(86,231,255,0)');hg.addColorStop(.5,'rgba(86,231,255,.11)');hg.addColorStop(1,'rgba(86,231,255,0)');
    ctx.strokeStyle=hg;ctx.beginPath();ctx.moveTo(s.x,horizon);ctx.lineTo(s.x+s.w,horizon);ctx.stroke();
    // radial perspective lines
    const vanishX=s.cx+(mode==='firm'?-80:0);
    for(let i=-15;i<=15;i++){
      const bx=vanishX+i*92;
      ctx.strokeStyle='rgba(84,150,174,.055)';ctx.beginPath();ctx.moveTo(vanishX,horizon);ctx.lineTo(bx,bottom);ctx.stroke();
    }
    // horizontal warped lines
    for(let i=0;i<12;i++){
      const u=i/11; const yy=lerp(horizon,bottom,Math.pow(u,1.75));
      const alpha=.035+.035*u;
      ctx.strokeStyle=`rgba(84,150,174,${alpha})`;ctx.beginPath();ctx.moveTo(s.x,yy);ctx.lineTo(s.x+s.w,yy);ctx.stroke();
    }
    ctx.restore();
  }

  const defaultNodes=[
    {id:'revenue',label:'REVENUE',value:'€418m',x:-270,y:-105,z:40},
    {id:'ebitda',label:'NORMALIZED EBITDA',value:'€30m',x:-92,y:-20,z:-10},
    {id:'debt',label:'DEBT CAPACITY',value:'€165m',x:115,y:-125,z:35},
    {id:'equity',label:'EQUITY CHECK',value:'€130m',x:282,y:-25,z:5},
    {id:'irr',label:'BASE IRR',value:'21.6%',x:218,y:145,z:5},
    {id:'price',label:'PRICE CEILING',value:'€295m',x:-5,y:204,z:-18},
    {id:'lender',label:'LENDER CASE',value:'BUILDABLE',x:-235,y:145,z:38},
    {id:'ic',label:'IC BASIS',value:'CURRENT',x:-350,y:28,z:60},
  ];
  const defaultEdges=[['revenue','ebitda'],['ebitda','debt'],['debt','equity'],['equity','irr'],['ebitda','price'],['price','irr'],['ebitda','lender'],['price','ic'],['irr','ic']];

  function project(pt,t,scaleMul=1,offset={x:0,y:0}){
    const s=stage();
    const yaw=.11*Math.sin(t*.00012)+(mode==='ripple'?.04:0);
    const pitch=.15;
    let x=pt.x,z=pt.z||0,y=pt.y||0;
    const rx=x*Math.cos(yaw)-z*Math.sin(yaw);
    const rz=x*Math.sin(yaw)+z*Math.cos(yaw);
    const ry=y*Math.cos(pitch)-rz*Math.sin(pitch);
    const rz2=y*Math.sin(pitch)+rz*Math.cos(pitch);
    const f=740/(740+rz2);
    return {x:s.cx+offset.x+rx*f*scaleMul,y:s.cy+offset.y+ry*f*scaleMul+rz2*.06,scale:f*scaleMul,depth:rz2};
  }

  function getGraphState(t){
    let nodes=defaultNodes.map(n=>({...n,state:'ok'}));
    if(mode==='dissonance') nodes=nodes.map(n=>n.id==='ebitda'?{...n,state:'bad',value:'€30m ?'}:n);
    if(mode==='ripple'||mode==='impact'||mode==='handoff'){
      const elapsed=(performance.now()-modeStart)/1000;
      const order=['ebitda','debt','equity','irr','price','lender','ic'];
      nodes=nodes.map(n=>{
        const idx=order.indexOf(n.id); if(idx<0) return n;
        const on=mode!=='ripple'||elapsed>idx*.55;
        if(!on) return n;
        const values={ebitda:'€26m',debt:'€143m',equity:'€152m',irr:'18.9%',price:'€284m',lender:'STALE',ic:'STALE'};
        return {...n,state:'warn',value:values[n.id]||n.value};
      });
    }
    if(mode==='decision'){
      nodes=nodes.map(n=>({ ...n, state:n.id==='price'||n.id==='irr'?'warn':'dim' }));
    }
    if(mode==='resolved'){
      const values={ebitda:'€26m',debt:'€143m',equity:'€141m',irr:'20.0%',price:'€284m',lender:'BUILDABLE',ic:'REFRESHED'};
      nodes=nodes.map(n=>({...n,state:'ok',value:values[n.id]||n.value}));
    }
    return nodes;
  }

  function drawDealGraph(t){
    const s=stage();
    let scale=.92, offset={x:0,y:0};
    if(mode==='impact'){scale=.60;offset={x:-270,y:-10}}
    if(mode==='handoff'){scale=.58;offset={x:-300,y:-15}}
    if(mode==='decision'){scale=.46;offset={x:-390,y:35}}
    const nodes=getGraphState(t); const map={};
    nodes.forEach(n=>map[n.id]=project(n,t,scale,offset));
    // orbit rings around center
    const core=project({x:0,y:35,z:0},t,scale,offset);
    ctx.save();
    for(let i=0;i<3;i++){
      ctx.strokeStyle=`rgba(86,231,255,${.09-i*.018})`;ctx.lineWidth=1;
      ctx.beginPath();ctx.ellipse(core.x,core.y,150*scale*(1+i*.5),58*scale*(1+i*.42),-.12,0,Math.PI*2);ctx.stroke();
    }
    ctx.restore();
    // edges
    ctx.save();ctx.lineWidth=1.1;
    defaultEdges.forEach((e,idx)=>{
      const a=map[e[0]],b=map[e[1]]; if(!a||!b) return;
      const na=nodes.find(n=>n.id===e[0]),nb=nodes.find(n=>n.id===e[1]);
      let color=C.cyan,alpha=.18;
      if(na.state==='warn'||nb.state==='warn'){color=C.amber;alpha=.34}
      if(na.state==='bad'||nb.state==='bad'){color=C.red;alpha=.42}
      if(na.state==='dim'||nb.state==='dim'){color=C.muted;alpha=.08}
      const gr=ctx.createLinearGradient(a.x,a.y,b.x,b.y);gr.addColorStop(0,rgba(color,.05));gr.addColorStop(.5,rgba(color,alpha));gr.addColorStop(1,rgba(color,.05));
      ctx.strokeStyle=gr;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.quadraticCurveTo((a.x+b.x)/2,(a.y+b.y)/2-22*scale,b.x,b.y);ctx.stroke();
      // moving pulse
      if(mode==='ripple'||mode==='impact'){
        const p=((performance.now()-modeStart)/900+idx*.17)%1;
        const qx=(1-p)*(1-p)*a.x+2*(1-p)*p*((a.x+b.x)/2)+(p*p)*b.x;
        const qy=(1-p)*(1-p)*a.y+2*(1-p)*p*((a.y+b.y)/2-22*scale)+(p*p)*b.y;
        ctx.fillStyle=color;glow(color,12);ctx.beginPath();ctx.arc(qx,qy,2.1,0,Math.PI*2);ctx.fill();noGlow();
      }
    });ctx.restore();
    // core
    ctx.save();
    const cg=ctx.createRadialGradient(core.x-15,core.y-18,2,core.x,core.y,68*scale);cg.addColorStop(0,'rgba(255,255,255,.28)');cg.addColorStop(.2,'rgba(86,231,255,.25)');cg.addColorStop(.62,'rgba(10,31,42,.92)');cg.addColorStop(1,'rgba(3,12,18,.4)');
    ctx.fillStyle=cg;glow(C.cyan,28);ctx.beginPath();ctx.arc(core.x,core.y,46*scale,0,Math.PI*2);ctx.fill();noGlow();
    ctx.strokeStyle='rgba(86,231,255,.5)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(core.x,core.y,46*scale,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle='#eafaff';ctx.font=`${Math.max(8,10*scale)}px Inter, sans-serif`;ctx.textAlign='center';ctx.fillText('PROJECT ATLAS',core.x,core.y-2);ctx.fillStyle='#6f8d9a';ctx.font=`${Math.max(7,8*scale)}px Inter, sans-serif`;ctx.fillText('LIVE INVESTMENT STATE',core.x,core.y+13*scale);ctx.restore();
    // nodes
    nodes.forEach((n,idx)=>drawNode(n,map[n.id],scale,t,idx));
    if(mode==='ingest') drawIngest(t,core);
    if(mode==='dissonance') drawContradiction(t,core);
    if(mode==='handoff') drawHandoff(t,core);
  }

  function drawNode(n,p,scale,t,idx){
    const colors={ok:C.green,warn:C.amber,bad:C.red,dim:C.muted}; const color=colors[n.state]||C.cyan;
    const r=(n.id==='ebitda'?17:13)*scale;
    ctx.save();
    ctx.fillStyle=rgba(color,n.state==='dim'?.12:.13);glow(color,n.state==='dim'?0:15);ctx.beginPath();ctx.arc(p.x,p.y,r*1.8,0,Math.PI*2);ctx.fill();noGlow();
    ctx.strokeStyle=rgba(color,n.state==='dim'?.15:.66);ctx.lineWidth=1.1;ctx.beginPath();ctx.arc(p.x,p.y,r,0,Math.PI*2);ctx.stroke();
    ctx.fillStyle=rgba(color,n.state==='dim'?.3:.96);ctx.beginPath();ctx.arc(p.x,p.y,2.4*scale,0,Math.PI*2);ctx.fill();
    const align=p.x<stage().cx?'right':'left';ctx.textAlign=align;
    const tx=p.x+(align==='left'?1:-1)*(r+8);
    ctx.fillStyle=n.state==='dim'?'rgba(113,141,154,.42)':'rgba(182,213,224,.72)';ctx.font=`${Math.max(7,8*scale)}px Inter, sans-serif`;ctx.fillText(n.label,tx,p.y-2);
    ctx.fillStyle=n.state==='dim'?'rgba(113,141,154,.35)':rgba(color,.92);ctx.font=`600 ${Math.max(8,10*scale)}px Inter, sans-serif`;ctx.fillText(n.value,tx,p.y+11*scale);
    ctx.restore();
  }

  function drawIngest(t,core){
    const elapsed=(performance.now()-modeStart)/1000; const p=Math.min(1,elapsed/5.2); const e=ease(p);
    const s=stage();const x=lerp(s.x+s.w+220,core.x+10,e), y=lerp(s.y+95,core.y-80,e);
    ctx.save();ctx.translate(x,y);ctx.rotate(lerp(-.14,.04,e));
    const ww=122,hh=76;ctx.fillStyle='rgba(8,23,32,.94)';ctx.strokeStyle='rgba(86,231,255,.5)';ctx.lineWidth=1;glow(C.cyan,18);ctx.beginPath();ctx.roundRect(-ww/2,-hh/2,ww,hh,8);ctx.fill();ctx.stroke();noGlow();
    ctx.fillStyle='#e7f7fd';ctx.font='600 10px Inter';ctx.textAlign='left';ctx.fillText('QoE v3',-46,-14);ctx.fillStyle='#6f8d9a';ctx.font='8px Inter';ctx.fillText('QUALITY OF EARNINGS',-46,1);ctx.fillText('1,284 evidence items',-46,15);ctx.fillStyle=C.cyan;ctx.fillRect(-46,26,75*p,2);ctx.restore();
    // stream particles
    for(let i=0;i<24;i++){
      const q=Math.max(0,Math.min(1,p-i*.018)); if(q<=0)continue; const px=lerp(x,core.x,q),py=lerp(y,core.y,q)+Math.sin(i*1.8+t*.003)*10;
      ctx.fillStyle=rgba(i%3===0?C.violet:C.cyan,.45);ctx.fillRect(px,py,1.5,1.5);
    }
  }

  function drawContradiction(t,core){
    const elapsed=(performance.now()-modeStart)/1000; const a=Math.min(1,elapsed/1.2);
    ctx.save();ctx.globalAlpha=a;
    const y=core.y-155;const x=core.x;
    ctx.strokeStyle=rgba(C.red,.6);ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(x,y+46);ctx.lineTo(core.x,core.y-50);ctx.stroke();ctx.setLineDash([]);
    glow(C.red,22);ctx.fillStyle='rgba(255,85,118,.11)';ctx.strokeStyle='rgba(255,85,118,.55)';ctx.beginPath();ctx.roundRect(x-155,y-38,310,82,12);ctx.fill();ctx.stroke();noGlow();
    ctx.textAlign='center';ctx.fillStyle=C.red;ctx.font='700 9px Inter';ctx.fillText('DISSONANCE DETECTED',x,y-16);
    ctx.fillStyle='#f3fbff';ctx.font='600 13px Inter';ctx.fillText('€4.0m add-back: proposed vs unsupported',x,y+5);
    ctx.fillStyle='#7895a3';ctx.font='9px Inter';ctx.fillText('Bound to open question Q-14 · “Is the cost truly non-recurring?”',x,y+25);
    ctx.restore();
  }

  function drawHandoff(t,core){
    const elapsed=(performance.now()-modeStart)/1000; const p=Math.min(1,elapsed/4.2); const s=stage();
    const start={x:core.x-20,y:core.y+25},end={x:s.x+s.w*.78,y:s.y+s.h*.42};
    const x=lerp(start.x,end.x,ease(p)),y=lerp(start.y,end.y,ease(p)) - Math.sin(p*Math.PI)*70;
    ctx.save();ctx.strokeStyle=rgba(C.violet,.25);ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(start.x,start.y);ctx.quadraticCurveTo((start.x+end.x)/2,(start.y+end.y)/2-100,end.x,end.y);ctx.stroke();ctx.setLineDash([]);
    glow(C.violet,22);ctx.fillStyle=C.violet;ctx.beginPath();ctx.arc(x,y,6,0,Math.PI*2);ctx.fill();noGlow();
    ctx.fillStyle='rgba(169,133,255,.11)';ctx.strokeStyle='rgba(169,133,255,.45)';ctx.beginPath();ctx.roundRect(end.x-62,end.y-24,124,48,12);ctx.fill();ctx.stroke();

(function(){

    S0_INTAKE:0, S1_INITIAL_ACCESS:0, S2_CASE_BUILDING:1, S3_SCREENING_ASSESSMENT:1,
    S4_PURSUIT:1, S5_ACTIVE_DILIGENCE:2, S6_FINAL_SYNTHESIS:2,
    S7_INVESTMENT_COMMITTEE:3, S8_PRE_CLOSE:4, S9_ACQUISITION:4,
    S10_OWNERSHIP:5, S11_REALIZATION:5, S12_EXIT_REALIZATION:7,
  };

  function extractMetrics(claims){
    const targets = {
      'opening firm EBITDA':'ebitda_firm',
      'QoE-normalized EBITDA':'ebitda_qoe',
      'FY2025E revenue':'revenue',
      'enterprise value':'ev',
      'first-lien opening debt':'debt',
      'opening net leverage ratio':'leverage',
    };
    const m = {};
    for(const c of (claims||[])){
      for(const [k,n] of Object.entries(targets)){
        if(c.subject===k && !m[n]) m[n]=c.value||'';
      }
    }
    return m;
  }

  function parseNum(s){
    if(!s) return null;
    const x=String(s).match(/[\d.]+/);
    return x?parseFloat(x[0]):null;
  }

  // ── view-specific DOM patches (run after renderer rebuilds overlay) ──────

  function patchShell(d){
    const stack = document.querySelector('.signal-stack');
    if(!stack) return;
    const openQs=(d.questions||[]).filter(q=>['open','reducing'].includes(q.state));
    const contras=(d.contradictions||[]).length;
    const nc=(d.claims||[]).length;
    const items=[];
    if(nc) items.push({t:`${nc} claims indexed`,c:`${openQs.length} open question${openQs.length===1?'':'s'} awaiting resolution.`,s:''});
    if(openQs.length){
      const top=openQs.find(q=>q.critical)||openQs[0];
      const isCrit=!!top.critical;
      items.push({t:(top.title||top.id||'Open question').substring(0,60),c:(isCrit?'Critical':'Open')+' — resolution required before next gate.',s:isCrit?'bad':'warn'});
    }
    if(contras) items.push({t:`${contras} contradiction candidate${contras===1?'':'s'}`,c:`${contras} claim subject${contras===1?' has':' have'} conflicting values across sources.`,s:contras>10?'bad':'warn'});
    else if(nc) items.push({t:'All claims reconcile',c:`No contradictions across ${nc} indexed claims.`,s:''});
    stack.innerHTML=items.map(s=>`<div class="signal-card ${s.s}"><div class="top"><span class="dot"></span><b>${s.t}</b></div><small>${s.c}</small></div>`).join('');
  }

  function patchEvidence(d){
    const qBody=document.querySelector('.panel-body.list');
    if(!qBody) return;
    const qs=(d.questions||[]).slice(0,6);
    if(!qs.length) return;
    qBody.innerHTML=qs.map(q=>{
      const s=q.state==='resolved'||q.state==='accepted-unresolved'?'ok':q.critical?'bad':'warn';
      const bc=(d.claims||[]).filter(c=>(c['bears-on']||[]).some(b=>b.includes(q.id||''))).length;
      const qt=(q.title||q.id||'').replace(/[<>&]/g,x=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[x]));
      return `<div class="list-item ${s}"><div class="main"><b>${qt.substring(0,55)}</b><small>${bc} claim${bc===1?'':'s'} · ${q.state||'open'}</small></div><div class="right">${q.state==='resolved'?'Resolved':q.state==='accepted-unresolved'?'Accepted':q.critical?'Critical':'Open'}</div></div>`;
    }).join('');
  }

  function patchDeal(d){
    const kpiRow=document.querySelector('.kpi-row');
    if(!kpiRow) return;
    const m=extractMetrics(d.claims||[]);
    const ev=parseNum(m.ev),debt=parseNum(m.debt),ebitda=parseNum(m.ebitda_firm);
    const leverage=ebitda&&debt?(debt/ebitda).toFixed(1)+'x':'—';
    const equity=ev&&debt?`$${(ev-debt).toFixed(1)}m`:'—';
    kpiRow.innerHTML=[
      ['Base IRR',d.state==='S12_EXIT_REALIZATION'?'8.7%':'—','',''],
      ['Leverage',leverage,'','amber'],
      ['EV',ev?`$${ev}m`:'—','','cyan'],
      ['Equity',equity,'',''],
    ].map(([l,v,dl,c])=>`<div class="kpi"><label>${l}</label><strong class="${c}">${v}</strong>${dl?`<span class="delta ${c}">${dl}</span>`:''}</div>`).join('');
  }

  function patchWorkstreams(d){
    const qBody=document.querySelector('.panel-body.list');
    if(!qBody) return;
    const outs=(d.outputs||[]);
    if(!outs.length) return;
    qBody.innerHTML=outs.slice(0,5).map(o=>{
      const ws=(o.workstream||'unknown').replace(/_/g,' ');
      const s=o.stale?'warn':'ok';
      const preview=(o.body||'').replace(/[#*`>-]/g,'').trim().replace(/\s+/g,' ').substring(0,72);
      return `<div class="list-item ${s}"><div class="main"><b>${ws}</b><small>${preview}…</small></div><div class="right">${o.stale?'Stale':'Live'}</div></div>`;
    }).join('');
  }

  // ─────────────────────────────────────────────────────────────────────────

  function applyLiveData(d){
    window.__peosData = d;
    const deal = d.deal||{};
    const metrics = extractMetrics(d.claims);

    // Canvas deal-graph nodes
    const ev=parseNum(metrics.ev), debt=parseNum(metrics.debt);
    const equity = ev&&debt ? (ev-debt).toFixed(1) : null;
    window.PantaField && window.PantaField.updateNodes({
      revenue: metrics.revenue ? `$${parseNum(metrics.revenue)}m` : null,
      ebitda:  metrics.ebitda_firm ? `$${parseNum(metrics.ebitda_firm)}m` : null,
      debt:    debt ? `$${debt}m` : null,
      equity:  equity ? `$${equity}m` : null,
      price:   ev ? `$${ev}m` : null,
      ic:      d.state==='S12_EXIT_REALIZATION' ? 'EXITED' : 'CURRENT',
      lender:  (d.contradictions&&d.contradictions.length>10)?'WATCH':'BUILDABLE',
    });

    // Metric floats (shell view)
    window.PEOS_METRICS = {
      'Normalized EBITDA': metrics.ebitda_firm ? `$${parseNum(metrics.ebitda_firm)}m` : '?',
      'Debt capacity':     debt ? `$${debt}m` : '?',
      'Base IRR':          d.state==='S12_EXIT_REALIZATION' ? '8.7%' : '—',
      'Price ceiling':     ev ? `$${ev}m` : '?',
    };

    // Lifecycle rail
    const phaseIdx = STATE_PHASE[d.state] ?? 2;
    const lifecycle = document.getElementById('lifecycle');
    if(lifecycle){
      const ps=['Screen','Diligence','Underwrite','Decide','Execute','Own','Exit'];
      lifecycle.innerHTML = ps.map((p,i)=>
        `<div class="phase ${i<phaseIdx?'done':''} ${i===phaseIdx&&phaseIdx<7?'active':''} ${i===phaseIdx&&phaseIdx===7?'done':''}">${p}</div>`
      ).join('');
    }

    // Flow status bar
    const openQs=(d.questions||[]).filter(q=>['open','reducing'].includes(q.state));
    const flowStatus=document.getElementById('flowStatus');
    if(flowStatus){
      flowStatus.innerHTML=[
        [`${(d.claims||[]).length} linked claims`,'ok'],
        [`${openQs.length} open questions`, openQs.length?'warn':'ok'],
        [`${(d.contradictions||[]).length} contradiction candidates`, (d.contradictions||[]).length>5?'warn':'ok'],
        [`${d.state_label||d.state||'?'}`,'ok'],
      ].map(x=>`<span class="${x[1]}"><i></i>${x[0]}</span>`).join('');
    }

    // Context breadcrumb
    const ctx=document.getElementById('context');
    if(ctx){
      const label=(deal.id||'deal').toUpperCase();
      ctx.innerHTML=`<span class="crumb">Portfolio</span><span class="slash">/</span><span class="major">${label}</span><span class="slash">/</span><span class="crumb">${d.state_label||d.state||''}</span>`;
    }

    // Re-render the current view with updated PEOS_METRICS
    if(window.__peosRenderers && window.__peosView){
      (window.__peosRenderers[window.__peosView]||window.__peosRenderers.shell)();
      // Second-pass: overwrite hardcoded demo content with live vault data
      const v=window.__peosView||'shell';
      if(v==='shell') patchShell(d);
      else if(v==='evidence') patchEvidence(d);
      else if(v==='deal') patchDeal(d);
      else if(v==='workstreams') patchWorkstreams(d);
    }
  }

  // ── Deal selector + "+" button ───────────────────────────────────────────

  async function refreshDealSelector(selectId){
    const topbar = document.querySelector('.top-actions');
    if(!topbar) return null;
    let sel = document.getElementById('peos-deal-sel');
    if(!sel){
      sel = document.createElement('select');
      sel.id = 'peos-deal-sel';
      sel.style.cssText='background:rgba(6,15,22,.8);border:1px solid rgba(126,220,255,.2);color:#dffaff;border-radius:8px;padding:5px 10px;font-size:10px;letter-spacing:.04em;cursor:pointer;height:34px;margin-right:6px';
      topbar.insertBefore(sel, topbar.firstChild);
      sel.onchange = () => loadDeal(sel.value);

      const addBtn = document.createElement('button');
      addBtn.title = 'New deal + extraction';
      addBtn.innerHTML = '+';
      addBtn.style.cssText='background:rgba(86,231,255,.1);border:1px solid rgba(86,231,255,.3);color:#dffaff;border-radius:8px;width:34px;height:34px;font-size:18px;line-height:1;cursor:pointer;margin-right:10px;flex-shrink:0';
      addBtn.onclick = openDemoModal;
      topbar.insertBefore(addBtn, sel.nextSibling);
    }
    const dealsRes = await fetch('/api/deals');
    const deals = await dealsRes.json();
    const real = deals.filter(d=>!d.demo);
    sel.innerHTML = real.map(d=>`<option value="${d.id}"${d.id===selectId?' selected':''}>${d.id.toUpperCase()}</option>`).join('');
    return real;
  }

  async function init(){
    try {
      const real = await refreshDealSelector();
      if(!real||!real.length) return;
      await loadDeal(real[0].id);
    } catch(e){ console.warn('PE OS backend:', e.message); }
  }

  async function loadDeal(id){
    const sel = document.getElementById('peos-deal-sel');
    if(sel) sel.value = id;
    const res = await fetch(`/api/deal/${id}`);
    const d = await res.json();
    applyLiveData(d);
  }

  // ── Demo modal ────────────────────────────────────────────────────────────

  const MODAL_CSS = `
    position:fixed;inset:0;z-index:9999;background:rgba(0,5,10,.72);
    backdrop-filter:blur(10px);display:grid;place-items:center;
  `;
  const CARD_CSS = `
    width:520px;padding:28px 30px;border-radius:20px;
    background:linear-gradient(145deg,rgba(9,23,33,.97),rgba(4,12,18,.92));
    border:1px solid rgba(126,220,255,.22);
    box-shadow:0 28px 90px rgba(0,0,0,.65),inset 0 1px 0 rgba(255,255,255,.02);
  `;
  const INPUT_CSS = `
    width:100%;background:rgba(3,12,19,.72);border:1px solid rgba(126,220,255,.18);
    color:#edf8ff;border-radius:10px;padding:9px 13px;font-size:12px;
    outline:none;font-family:inherit;transition:border-color .18s;
  `;
  const LABEL_CSS = `
    display:block;font-size:8px;color:#6a8799;text-transform:uppercase;
    letter-spacing:.11em;margin-bottom:6px;
  `;
  const PRIMARY_BTN = `
    width:100%;background:linear-gradient(135deg,rgba(86,231,255,.16),rgba(70,255,208,.07));
    border:1px solid rgba(86,231,255,.36);color:#dffaff;border-radius:10px;
    padding:12px;font-size:11px;font-weight:600;letter-spacing:.06em;cursor:pointer;
    transition:opacity .15s;font-family:inherit;
  `;
  const SEC_BTN = `
    background:rgba(6,18,26,.65);border:1px solid rgba(126,220,255,.14);color:#7993a2;
    border-radius:10px;padding:12px 18px;font-size:11px;cursor:pointer;font-family:inherit;
  `;

  function demoModalHTML(){
    return `<div id="dm-overlay" style="${MODAL_CSS}">
<div style="${CARD_CSS}">
  <div style="display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:22px">
    <div>
      <div style="font-size:8px;color:#56e7ff;letter-spacing:.18em;text-transform:uppercase;margin-bottom:7px">PE OS · Local demo</div>
      <div style="font-size:20px;font-weight:650;letter-spacing:-.02em">New deal + extraction</div>
    </div>
    <button id="dm-close" style="background:none;border:none;color:#5a7585;font-size:22px;cursor:pointer;line-height:1;padding:2px 6px;border-radius:6px" title="close">×</button>
  </div>

  <!-- Step 1 -->
  <div id="dm-s1">
    <div style="font-size:8px;color:#56e7ff;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px"><span style="width:18px;height:18px;border-radius:50%;border:1px solid rgba(86,231,255,.35);display:grid;place-items:center;font-size:9px">1</span> Deal identity</div>
    <div style="display:flex;flex-direction:column;gap:11px">
      <div><label style="${LABEL_CSS}">Deal name</label><input id="dm-name" placeholder="e.g. Meridian" style="${INPUT_CSS}" /></div>
      <div><label style="${LABEL_CSS}">Company</label><input id="dm-company" placeholder="e.g. Meridian Technologies Ltd" style="${INPUT_CSS}" /></div>
      <div><label style="${LABEL_CSS}">Investment thesis</label><textarea id="dm-thesis" rows="3" placeholder="Describe the core investment hypothesis in 2-3 sentences." style="${INPUT_CSS}resize:vertical;line-height:1.5"></textarea></div>
    </div>
    <button id="dm-create" style="${PRIMARY_BTN}margin-top:18px">Create deal →</button>
  </div>

  <!-- Step 2 -->
  <div id="dm-s2" style="display:none">
    <div style="font-size:8px;color:#56e7ff;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px"><span style="width:18px;height:18px;border-radius:50%;border:1px solid rgba(86,231,255,.35);display:grid;place-items:center;font-size:9px">2</span> Artifact upload</div>
    <div id="dm-drop" style="border:2px dashed rgba(126,220,255,.22);border-radius:14px;padding:30px 20px;text-align:center;cursor:pointer;transition:border-color .2s">
      <div style="font-size:30px;margin-bottom:10px;opacity:.35">⇪</div>
      <div style="font-size:11px;color:#8aa5b2">Drop a <code style="color:#56e7ff;background:rgba(86,231,255,.08);padding:1px 5px;border-radius:4px">.md</code> or <code style="color:#56e7ff;background:rgba(86,231,255,.08);padding:1px 5px;border-radius:4px">.txt</code> file, or click to browse</div>
      <div style="font-size:9px;color:#405a68;margin-top:6px">CIM · QoE report · model summary · call transcript</div>
    </div>
    <input type="file" id="dm-file" accept=".md,.txt" style="display:none">
    <div id="dm-fname" style="font-size:10px;color:#56e7ff;margin-top:9px;min-height:14px"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button id="dm-extract" style="${PRIMARY_BTN}">Upload & extract →</button>
      <button id="dm-skip" style="${SEC_BTN}">Skip</button>
    </div>
  </div>

  <!-- Step 3 -->
  <div id="dm-s3" style="display:none">
    <div style="font-size:8px;color:#56e7ff;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px;display:flex;align-items:center;gap:8px"><span style="width:18px;height:18px;border-radius:50%;border:1px solid rgba(86,231,255,.35);display:grid;place-items:center;font-size:9px">3</span> Extraction log</div>
    <div id="dm-log" style="font-family:'SF Mono',Menlo,monospace;font-size:10px;color:#68ff9f;background:rgba(2,9,13,.8);border:1px solid rgba(104,255,159,.14);border-radius:10px;padding:14px 16px;min-height:130px;max-height:210px;overflow-y:auto;line-height:1.75;white-space:pre-wrap"></div>
    <button id="dm-done" style="${PRIMARY_BTN.replace('rgba(86,231,255,.16)','rgba(104,255,159,.12)').replace('rgba(70,255,208,.07)','rgba(104,255,159,.04)').replace('rgba(86,231,255,.36)','rgba(104,255,159,.35)').replace('#dffaff','#b0ffd0')}display:none;margin-top:14px">Open deal in field →</button>
  </div>
</div></div>`;
  }

  function openDemoModal(){
    if(document.getElementById('dm-overlay')) return;
    window.__demo = {};
    document.body.insertAdjacentHTML('beforeend', demoModalHTML());

    const close = ()=>{ const el=document.getElementById('dm-overlay'); if(el) el.remove(); };
    document.getElementById('dm-close').onclick = close;
    document.getElementById('dm-overlay').onclick = e=>{ if(e.target.id==='dm-overlay') close(); };

    document.getElementById('dm-create').onclick = demoCreate;

    const drop = document.getElementById('dm-drop');
    const fileIn = document.getElementById('dm-file');
    drop.onclick = ()=>fileIn.click();
    drop.ondragover = e=>{ e.preventDefault(); drop.style.borderColor='rgba(86,231,255,.6)'; };
    drop.ondragleave = ()=>{ drop.style.borderColor='rgba(126,220,255,.22)'; };
    drop.ondrop = e=>{ e.preventDefault(); drop.style.borderColor='rgba(126,220,255,.22)'; demoSetFile(e.dataTransfer.files[0]); };
    fileIn.onchange = ()=>demoSetFile(fileIn.files[0]);

    document.getElementById('dm-extract').onclick = demoUploadExtract;
    document.getElementById('dm-skip').onclick = demoSkip;
    document.getElementById('dm-done').onclick = demoDone;

    // Focus first input
    setTimeout(()=>document.getElementById('dm-name').focus(), 80);
  }

  function demoSetFile(f){
    if(!f) return;
    window.__demo.file = f;
    document.getElementById('dm-fname').textContent = `✓ ${f.name} · ${(f.size/1024).toFixed(1)} KB`;
  }

  function demoLog(msg, ok=true){
    const log = document.getElementById('dm-log');
    if(!log) return;
    const line = document.createElement('div');
    line.style.color = ok ? '#68ff9f' : '#ff8fa0';
    line.textContent = msg;
    log.appendChild(line);
    log.scrollTop = log.scrollHeight;
  }

  async function demoCreate(){
    const name = document.getElementById('dm-name').value.trim();
    const company = document.getElementById('dm-company').value.trim();
    const thesis = document.getElementById('dm-thesis').value.trim();
    if(!name||!company||!thesis){
      document.getElementById('dm-name').style.borderColor='rgba(255,85,118,.55)';
      return;
    }
    const btn = document.getElementById('dm-create');
    btn.disabled=true; btn.style.opacity='.5'; btn.textContent='Creating…';
    try {
      const res = await fetch('/api/deals',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,company,thesis})});
      const d = await res.json();
      if(!res.ok) throw new Error(d.detail||JSON.stringify(d));
      window.__demo.dealId = d.id;
      document.getElementById('dm-s1').style.display='none';
      document.getElementById('dm-s2').style.display='block';
    } catch(e){
      btn.disabled=false; btn.style.opacity='1'; btn.textContent='Create deal →';
      demoGoLog(); demoLog('Error creating deal: '+e.message, false);
    }
  }

  function demoGoLog(){
    document.getElementById('dm-s1').style.display='none';
    document.getElementById('dm-s2').style.display='none';
    document.getElementById('dm-s3').style.display='block';
  }

  async function demoUploadExtract(){
    if(!window.__demo.file){ document.getElementById('dm-fname').style.color='#ff8fa0'; document.getElementById('dm-fname').textContent='← select a file first'; return; }
    const deal = window.__demo.dealId;
    demoGoLog();
    demoLog(`Deal created: ${deal}`);
    demoLog('Uploading artifact…');
    try {
      const fd = new FormData();
      fd.append('file', window.__demo.file);
      const up = await fetch(`/api/upload?deal=${deal}`,{method:'POST',body:fd});
      const upd = await up.json();
      if(!up.ok) throw new Error(upd.detail||'upload failed');
      demoLog(`Stored → ${upd.stored}`);
      demoLog(`${upd.note}`);
      demoLog('Running extraction agent (LLM call — may take ~30s)…');
      const ex = await fetch('/api/agents/run/extractor',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({config:{deal}})});
      const exd = await ex.json();
      if(!ex.ok) throw new Error(exd.detail||'extraction failed');
      demoLog(exd.summary||'Done.');
      demoLog('✓ Extraction complete.');
    } catch(e){ demoLog('Error: '+e.message, false); }
    document.getElementById('dm-done').style.display='block';
  }

  function demoSkip(){
    const deal = window.__demo.dealId;
    demoGoLog();
    demoLog(`Deal created: ${deal}`);
    demoLog('No artifact uploaded.');
    demoLog('✓ Deal is ready (empty).');
    document.getElementById('dm-done').style.display='block';
  }

  async function demoDone(){
    const id = window.__demo.dealId;
    const el = document.getElementById('dm-overlay');
    if(el) el.remove();
    await refreshDealSelector(id);
    await loadDeal(id);
  }

  // ─────────────────────────────────────────────────────────────────────────

  window.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
