model_grammar:
  purpose: Translate an observable operating engine into reconciled growth, contribution, cash, financing and security-level
    outcomes.
  principles:
  - Reconcile metric definitions before modeling growth.
  - Build growth from the economic units and causal relationships selected by the business-model modules.
  - Separate organic, acquired, price, volume, mix, repeat, expansion and new-customer effects where applicable.
  - Use the economically correct gross or contribution measure, not a label supplied by a source.
  - Connect contracted or indicated demand to implementation, delivery and recognized revenue.
  - Model financing, dilution, liquidity timing and multiple compression explicitly.
  - No valuation output becomes a human Decision or canonical supported price.
  modules:
    operating_engine_bridge:
      activation: Always; the active business-model modules define the economic unit and bridge.
      relationship: Opening economic base + new activity + repeat or expansion + price/volume/mix effects - churn,
        contraction, loss or cancellation = ending economic base and recognized output.
      outputs:
      - recognized_revenue
      - durable_economic_base
      - growth_decomposition
      - customer_or_unit_state
    commercial_capacity:
      activation: When growth depends on identifiable sales, channel, transaction-supply, project-origination or deployment
        capacity.
      relationship: Available productive capacity × ramp or readiness × conversion or completion × realized output
        determines new business or delivered volume.
      outputs:
      - new_revenue_or_volume
      - capacity_requirement
      - hiring_or_supply_dependency
    unit_economics:
      activation: When the business has a definable economic unit or contract.
      relationship: Realized value less fully loaded acquisition, delivery, implementation, support, loss and capital
        cost determines unit or contract contribution.
      outputs:
      - gross_profit
      - contribution
      - payback_or_cash_recovery
      - economic_unit_quality
    operating_leverage:
      activation: When scale, profitability, cash or additional financing is decision-relevant.
      relationship: Gross or contribution profit less operating costs, capex, working capital, cash taxes and financing
        requirements determines cash generation.
      outputs:
      - ebitda_or_operating_profit
      - free_cash_flow
      - capital_to_self_funding
    returns_and_liquidity:
      activation: Always at a security Decision.
      relationship: Operating duration and quality, financing and dilution, security terms, valuation and liquidity
        timing determine investor outcomes.
      outputs:
      - loss_state
      - downside_state
      - base_state
      - upside_state
      - return_measures
