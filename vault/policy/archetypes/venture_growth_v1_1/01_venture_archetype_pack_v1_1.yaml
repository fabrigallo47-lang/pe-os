model_grammar:
  purpose: Translate milestones, financing path, ownership and outcome states into an auditable venture case.
  principles:
  - The model is a state-and-branch model before it is a point forecast.
  - Current facts, future assumptions and milestone conditions remain distinct.
  - Probability weights are optional Assumptions, never observed facts.
  - A future financing is an explicit dependency with timing, amount, terms and dilution.
  - Zero, delay and down-round states must remain representable.
  - No model output becomes a human Decision or a canonical supported price.
  modules:
    milestone_path:
      inputs:
      - milestone
      - success_test
      - date
      - cost
      - dependency
      - owner
      outputs:
      - milestone_state
      - evidence_state
      - time_to_next_proof
    cash_and_runway:
      relationship: opening cash + committed financing + operating receipts - cash costs - capex - working capital
        = ending cash
      outputs:
      - runway
      - capital_to_milestone
      - financing_deadline
    financing_and_dilution:
      relationship: ownership evolves through option pools, primary rounds, conversion, secondaries and pro-rata participation
      outputs:
      - fully_diluted_ownership
      - security_waterfall
      - future_capital_need
    commercial_progression:
      relationship: commercial signal state progresses from interest through paid, repeated and expanded production
        use
      outputs:
      - pilot_conversion
      - repeat_usage
      - revenue_quality
    outcome_distribution:
      relationship: coherent technical, commercial and financing states determine security proceeds and return
      outputs:
      - zero_case
      - partial_recovery
      - base_state
      - outlier_state
      - moic
      - irr
