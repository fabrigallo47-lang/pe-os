sub_archetype_flags:
  LEVERAGED_ACQUISITION:
    activation: Debt is material to price, returns, liquidity or closing certainty.
    adds_or_intensifies:
    - financing
    - covenant model
    - funds certainty
    - downside cash
  CORPORATE_CARVE_OUT:
    activation: The acquired business depends on parent entities, systems or shared services.
    adds_or_intensifies:
    - perimeter
    - TSA
    - standalone costs
    - separation milestones
  FOUNDER_OR_MANAGEMENT_DEPENDENT:
    activation: Continuity, succession, key people or alignment is central.
    adds_or_intensifies:
    - key-person questions
    - rollover
    - governance
    - succession conditions
  BUY_AND_BUILD:
    activation: The case relies on add-ons or integration of acquisitions.
    adds_or_intensifies:
    - incremental economics
    - integration capacity
    - acquisition headroom
    - synergy controls
  ACCESS_CONSTRAINED_AUCTION:
    activation: Material access follows offer acceptance or exclusivity.
    adds_or_intensifies:
    - explicit unknowns
    - conditional early offer
    - confirmatory diligence
  INTERMEDIATED_OR_SPONSOR_LED_COINVEST:
    activation: Information and authority are mediated by a lead sponsor or vehicle.
    adds_or_intensifies:
    - information lineage
    - sponsor reliance
    - allocation
    - separate authority
  TAKE_PRIVATE_OR_PUBLIC_MARKET:
    activation: The target or process has public-market features.
    adds_or_intensifies:
    - market-window evidence
    - shareholder approvals
    - unaffected price
    - funds certainty
  LEAD_CONTROL_INVESTOR:
    activation: The fund controls governance and ownership execution.
    adds_or_intensifies:
    - ownership readiness
    - board design
    - VCP monitoring
    - exit authority
