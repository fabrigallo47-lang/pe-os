compiler_use:
  routing_rule: Use workstream/concept families to select schemas. Category never creates identity or contradiction.
  binding_rule: Every material Claim should identify candidate Questions and, where justified, Readings, Assumptions
    or ModelNodes.
  new_structure_rule: If material content cannot bind, propose a new Question/Concept with evidence and rationale.
  day_zero_rule: Questions may exist without StatedPositions or CaseReadings; show that no one has expressed a view.
non_goals:
- Make every workstream compulsory at equal depth.
- Require a named third-party report when the underlying function can be satisfied another way.
- Put debt schedules or LBO formulas in the Universal Kernel.
- Treat UI sections, house process or historical frequency as the Archetype.
- Prevent AI discovery of deal-specific Questions.
archetype_boundary:
  definition: A reusable description of buyout economics and underwriting functions, not the preferences of one institution.
  inclusion_test:
  - The item remains relevant if the same deal is underwritten by another competent buyout investor.
  - The item follows from asset economics, ownership rights, transaction structure or loss mechanics.
  - The item survives changes in committee names, templates, providers, thresholds and cadence.
  - The item can be expressed without a house-specific hurdle, score, authority body or mandatory artifact.
  excluded_to_fund_lens:
  - materiality thresholds and scoring weights
  - evidence sufficiency bars by phase
  - return hurdles and supported-price policy
  - authority bodies, quorum, delegation and spend thresholds
  - mandatory artifacts, templates, naming and review cadence
  - tool cost/duration bands and preferred providers
  - house definitions and adjustment conventions
  - automatic-admission thresholds and operative-value selection policy
  excluded_to_deal_state:
  - specific facts, people, values, sources, process dates, terms and decisions
  evidence_examples_rule: Typical evidence lists are routing examples, not mandatory evidence requirements.
