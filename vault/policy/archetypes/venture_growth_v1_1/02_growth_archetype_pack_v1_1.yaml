compiler_use:
  routing_rule: Use engine maturity, workstream and concept families. Do not route only by round or company label.
  binding_rule: Bind claims to exact metric identities and Questions before computing revenue quality, repeatability
    or operating leverage.
  new_structure_rule: Propose new segment, product, geography, capacity or transformation Questions when the existing
    engine no longer explains the case.
  day_zero_rule: Show the available operating evidence and unanswered repeatability Questions without inventing a
    positive Reading.
  metric_rule: Recognized revenue, recurring base, bookings, backlog, pipeline and business-model operating volume
    remain separate identities and cannot be silently substituted.
  question_activation_rule: Use the shared activation contract to form a bounded decision-bearing spine; never instantiate
    every family.
  module_rule: Select maturity, business-model, sector and transaction modules independently and preserve every origin.
  tool_rule: A completed method may add evidence, CoverageLimits or WorkItems; it cannot automatically close a Question.
  concept_activation_rule: Canonical concept seeds are available vocabulary, not compulsory fields. Activate only
    those made applicable by the Deal Frame, active modules, source evidence or model dependencies.
non_goals:
- Treat headline growth or a large pipeline as evidence of repeatability.
- Require a software-specific metric set for every Growth company.
- Assume margin expansion because scale increases.
- Encode one institution's hurdle, concentration limit, ownership target or process.
- Treat follow-on capital as automatically protective of an existing position.
- Prevent Venture or sector modules from activating where the case remains technically or regulatorily unproven.
- Treat a business model as a sector or a sector as a business model.
- Store empirical corpus counts or institution-specific validation metadata in the production pack.
- Duplicate maturity, business-model, sector or transaction module definitions inside the pack.
- Treat completion of a diligence method or artifact as closure of an underwriting Question.
- Represent deal sourcing, fundraising, limited-partner relations or the complete investment-firm operating model.
- Replace a dedicated ownership, portfolio-monitoring or operating-value-creation system beyond case re-underwriting.
- Treat every canonical concept seed as an active metric or required data field.
- Force a debt-dominant, control-buyout or asset-level infrastructure case into Venture or Growth.
archetype_boundary:
  definition: Reusable Growth economics and epistemology, not the preferences of one institution.
  inclusion_test:
  - The item remains relevant for another competent Growth investor facing the same engine and transaction.
  - The item follows from revenue quality, repeatability, operating leverage, capital needs or liquidity mechanics.
  - The item survives changes in committee, ticket, threshold, template, provider and cadence.
  excluded_to_fund_lens:
  - minimum growth, retention, margin or runway threshold
  - return hurdle and valuation ceiling
  - target ownership, ticket and concentration
  - required audit, customer-reference or diligence depth
  - follow-on, write-down and liquidity policy
  - authority bodies and process cadence
  - house metric definitions and accepted adjustments
  - preferred sectors, geographies, investors and providers
  excluded_to_deal_state:
  - specific company facts, sources, people, values, dates, terms, customers, forecasts and decisions
  evidence_examples_rule: Evidence lists guide retrieval and work design. They are non-exhaustive and never constitute
    mandatory sufficiency or automatic closure.
